<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Klassificering - Eventful Desk</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    .classification-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.classification-card{background:#fff;border-radius:32px;padding:30px;box-shadow:0 10px 34px #0f172a0b}.classification-card h2{font-size:28px;margin:0 0 14px}.classification-card p{color:#475569;margin:0 0 20px}.create-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin-bottom:22px}.create-row .input{min-width:0}.item-list{display:grid}.item-row{display:flex;gap:14px;align-items:center;border-bottom:1px solid #e2e8f0;padding:14px 0}.item-row strong{flex:1}.empty{color:#64748b;padding:12px 0}.feedback{min-height:24px;font-weight:800;margin-bottom:12px}.feedback.error{color:#b91c1c}.feedback.success{color:#166534}@media(max-width:900px){.classification-grid{grid-template-columns:1fr}.create-row{grid-template-columns:1fr}.create-row .btn{width:100%}}
  </style>
</head>
<body>
<main class="page">
  <p class="eyebrow">Administration</p>
  <h1 class="title">Klassificering</h1>
  <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

  <div class="classification-grid">
    <section class="classification-card">
      <h2>Tjänster</h2>
      <p>Alternativ i fältet <strong>Tjänst</strong> på ärenden.</p>
      <form id="serviceForm" class="create-row">
        <input id="serviceInput" class="input" type="text" maxlength="100" placeholder="Ex. FlowSync" autocomplete="off">
        <button id="serviceButton" class="btn btn-primary" type="submit">Lägg till</button>
      </form>
      <div id="serviceList" class="item-list"></div>
    </section>

    <section class="classification-card">
      <h2>Kategorier</h2>
      <p>Alternativ i fältet <strong>Kategori</strong> på ärenden.</p>
      <form id="categoryForm" class="create-row">
        <input id="categoryInput" class="input" type="text" maxlength="100" placeholder="Ex. Synk & integration" autocomplete="off">
        <button id="categoryButton" class="btn btn-primary" type="submit">Lägg till</button>
      </form>
      <div id="categoryList" class="item-list"></div>
    </section>
  </div>
</main>

<script type="module">
import { mount } from './js/layout.js';
import { requireRole } from './js/auth.js';
import { get, put } from './js/api.js';

await requireRole(['admin']);
mount('categories.html');

const feedbackEl = document.getElementById('feedback');
const serviceForm = document.getElementById('serviceForm');
const categoryForm = document.getElementById('categoryForm');
const serviceInput = document.getElementById('serviceInput');
const categoryInput = document.getElementById('categoryInput');
const serviceButton = document.getElementById('serviceButton');
const categoryButton = document.getElementById('categoryButton');
const serviceList = document.getElementById('serviceList');
const categoryList = document.getElementById('categoryList');

let settings = {};

function esc(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function notify(text,type=''){feedbackEl.textContent=text||'';feedbackEl.className='feedback'+(type?' '+type:'')}
function normalize(items){return [...new Set((Array.isArray(items)?items:[]).map(x=>String(x||'').trim()).filter(Boolean))]}

function render(){
  settings.services=normalize(settings.services);
  settings.categories=normalize(settings.categories);
  serviceList.innerHTML=settings.services.length?settings.services.map((name,index)=>`<div class="item-row"><strong>${esc(name)}</strong><button type="button" class="btn btn-danger" data-remove-service="${index}">Ta bort</button></div>`).join(''):'<div class="empty">Inga tjänster registrerade.</div>';
  categoryList.innerHTML=settings.categories.length?settings.categories.map((name,index)=>`<div class="item-row"><strong>${esc(name)}</strong><button type="button" class="btn btn-danger" data-remove-category="${index}">Ta bort</button></div>`).join(''):'<div class="empty">Inga kategorier registrerade.</div>';
  serviceList.querySelectorAll('[data-remove-service]').forEach(button=>button.addEventListener('click',()=>removeItem('services',Number(button.dataset.removeService))));
  categoryList.querySelectorAll('[data-remove-category]').forEach(button=>button.addEventListener('click',()=>removeItem('categories',Number(button.dataset.removeCategory))));
}

async function load(){
  try{
    settings=await get('/api/settings')||{};
    settings.services=normalize(settings.services);
    settings.categories=normalize(settings.categories);
    render();
  }catch(error){notify('Kunde inte läsa klassificeringen: '+(error.message||error),'error')}
}

async function save(message){
  try{
    const result=await put('/api/settings',settings);
    settings={...settings,...(result||{})};
    settings.services=normalize(settings.services);
    settings.categories=normalize(settings.categories);
    render();
    notify(message,'success');
    return true;
  }catch(error){notify('Kunde inte spara: '+(error.message||error),'error');return false}
}

async function addItem(kind,input,button){
  const value=input.value.trim();
  if(!value){notify('Skriv ett namn först.','error');input.focus();return}
  const values=normalize(settings[kind]);
  if(values.some(item=>item.toLocaleLowerCase('sv-SE')===value.toLocaleLowerCase('sv-SE'))){notify('Värdet finns redan.','error');input.focus();return}
  values.push(value);settings[kind]=values;
  button.disabled=true;
  const ok=await save(kind==='services'?'Tjänsten har lagts till.':'Kategorin har lagts till.');
  button.disabled=false;
  if(ok){input.value='';input.focus()}
}

async function removeItem(kind,index){
  const values=normalize(settings[kind]);
  const value=values[index];
  if(value==null)return;
  if(!confirm(`Ta bort ${value}?`))return;
  values.splice(index,1);settings[kind]=values;
  await save(kind==='services'?'Tjänsten har tagits bort.':'Kategorin har tagits bort.');
}

serviceForm.addEventListener('submit',event=>{event.preventDefault();addItem('services',serviceInput,serviceButton)});
categoryForm.addEventListener('submit',event=>{event.preventDefault();addItem('categories',categoryInput,categoryButton)});

await load();
</script>
</body>
</html>
