<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapporter - Eventful Desk</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"></head><body><main class="page"><h1 class="title">Rapporter</h1><div class="card"><p>Exportera aktuell ärendelista till CSV.</p><button id="exportBtn" class="btn btn-primary">Exportera CSV</button></div></main><script type="module">import{mount}from'./js/layout.js';import{requireRole}from'./js/auth.js';import{get}from'./js/api.js';await requireRole(['admin','agent']);mount('reports.html');exportBtn.onclick=async()=>{const a=await get('/api/tickets');const cols=['id','subject','customerName','status','priority','service','assignedAgentName','createdAt','updatedAt'];const csv='\ufeff'+[cols,...a.map(x=>cols.map(c=>x[c]??''))].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),x=document.createElement('a');x.href=u;x.download='eventful-desk-tickets.csv';x.click();URL.revokeObjectURL(u)};</script></body></html>
