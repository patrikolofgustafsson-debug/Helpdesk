<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunskapsbas - Eventful Desk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        html, body { margin: 0; padding: 0; background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        #main-content { margin-left: 16rem; padding: 3rem; min-height: 100vh; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        @media (max-width: 1024px) { #main-content { margin-left: 0; padding: 1.5rem; } }
    </style>
</head>
<body>

    <div id="main-content">
        <header class="flex justify-between items-end mb-12">
            <div>
                <h2 class="text-blue-600 text-[10px] font-black uppercase tracking-[0.3em] mb-2 italic">Knowledge Base</h2>
                <h1 class="text-5xl font-black text-slate-800 uppercase tracking-tighter italic">Kunskapsbas</h1>
            </div>
            <button onclick="openKbModal()" class="bg-blue-600 text-white px-8 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-lg hover:scale-105 transition">Ny Artikel</button>
        </header>

        <div class="max-w-4xl mb-10">
            <div class="relative">
                <i class="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="kbSearch" oninput="render()" placeholder="Sök..." class="w-full p-6 pl-14 bg-white rounded-[2rem] border-none shadow-sm outline-none font-bold text-xs focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <div id="kbGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </div>

    <div id="kbModal" style="display:none;" class="fixed inset-0 bg-slate-900/95 items-center justify-center p-4 z-[100]">
        <div class="bg-white w-full max-w-3xl rounded-[3.5rem] p-12 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <h3 id="modalTitle" class="text-3xl font-black mb-8 uppercase italic tracking-tighter">Ny Artikel</h3>
            <div class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <input id="k-title" type="text" placeholder="Rubrik" class="p-5 bg-slate-50 rounded-2xl border-none font-bold text-sm outline-none">
                    <input id="k-cat" type="text" placeholder="Kategori" class="p-5 bg-slate-50 rounded-2xl border-none font-bold text-sm outline-none">
                </div>
                <textarea id="k-content" placeholder="Innehåll..." class="w-full p-8 bg-slate-50 rounded-[2.5rem] border-none font-medium text-slate-600 h-64 leading-relaxed outline-none"></textarea>
                <div id="imageContainer" class="hidden p-4 bg-slate-50 rounded-3xl relative inline-block">
                    <img id="k-img-preview" src="" class="h-40 rounded-2xl border border-white shadow-sm">
                    <button onclick="removeImage()" class="absolute -top-2 -right-2 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center">×</button>
                </div>
                <div class="flex justify-between items-center pt-6 border-t">
                    <label class="cursor-pointer bg-slate-100 px-8 py-4 rounded-2xl text-[10px] font-black uppercase text-slate-500">Bild<input type="file" class="hidden" onchange="handleFileSelect(this)" accept="image/*"></label>
                    <div class="flex gap-4">
                        <button onclick="closeLocalModal()" class="px-8 py-4 text-slate-400 font-black uppercase text-[10px]">Avbryt</button>
                        <button onclick="saveKb()" class="bg-blue-600 text-white px-10 py-4 rounded-2xl font-black uppercase text-[10px] shadow-xl">Spara</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        let allKb = [];
        let currentEditId = null;
        let currentImageData = null;

        async function init() {
            const res = await fetch('/api/kb?t=' + Date.now());
            const data = await res.json();
            allKb = Array.isArray(data) ? data : [data];
            render();
        }

        function render() {
            const grid = document.getElementById('kbGrid');
            const search = document.getElementById('kbSearch').value.toLowerCase();
            grid.innerHTML = allKb.filter(k => k.title.toLowerCase().includes(search)).map(k => `
                <div class="bg-white p-8 rounded-[3rem] border border-slate-100 shadow-sm flex flex-col group">
                    <span class="text-[9px] text-blue-500 uppercase font-black mb-2">${k.category || 'Info'}</span>
                    <h4 class="text-2xl font-black text-slate-800 uppercase italic mb-4">${k.title}</h4>
                    <p class="text-slate-400 text-xs mb-6 line-clamp-2">${k.content}</p>
                    ${k.image ? `<img src="${k.image}" class="mb-6 rounded-2xl h-40 object-cover">` : ''}
                    <button onclick="openKbModal('${k.id}')" class="mt-auto bg-slate-50 py-4 rounded-2xl text-[9px] font-black uppercase hover:bg-blue-600 hover:text-white transition">Redigera</button>
                </div>
            `).join('');
        }

        function openKbModal(id = null) {
            currentEditId = id;
            currentImageData = null;
            document.getElementById('imageContainer').classList.add('hidden');
            
            if (id) {
                const item = allKb.find(x => x.id == id);
                document.getElementById('modalTitle').innerText = "Redigera Artikel";
                document.getElementById('k-title').value = item.title;
                document.getElementById('k-cat').value = item.category;
                document.getElementById('k-content').value = item.content;
                if (item.image) {
                    currentImageData = item.image;
                    document.getElementById('k-img-preview').src = item.image;
                    document.getElementById('imageContainer').classList.remove('hidden');
                }
            } else {
                document.getElementById('modalTitle').innerText = "Ny Artikel";
                document.getElementById('k-title').value = "";
                document.getElementById('k-cat').value = "";
                document.getElementById('k-content').value = "";
            }
            document.getElementById('kbModal').style.display = 'flex';
        }

        function closeLocalModal() { document.getElementById('kbModal').style.display = 'none'; }

        async function saveKb() {
            const payload = {
                id: currentEditId, // Detta är nyckeln!
                title: document.getElementById('k-title').value,
                category: document.getElementById('k-cat').value,
                content: document.getElementById('k-content').value,
                image: currentImageData
            };

            console.log("Skickar payload till server:", payload);

            const res = await fetch('/api/kb/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                closeLocalModal();
                setTimeout(init, 300);
            }
        }

        function handleFileSelect(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    currentImageData = e.target.result;
                    document.getElementById('k-img-preview').src = currentImageData;
                    document.getElementById('imageContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            currentImageData = null;
            document.getElementById('imageContainer').classList.add('hidden');
        }

        window.onload = init;
    </script>
</body>
</html>
