<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kunskapsbas - Eventful Desk</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"></head><body><main class="page"><div class="toolbar"><h1 class="title" style="flex:1">Kunskapsbas</h1><button id="newBtn" class="btn btn-primary">Ny artikel</button></div><input id="search" class="input" placeholder="Sök..." style="max-width:500px;margin-bottom:20px"><div id="cards" class="grid grid-2"></div></main><div id="modal" class="modal"><div class="modal-box stack"><input id="id" type="hidden"><input id="articleTitle" class="input" placeholder="Rubrik"><input id="category" class="input" placeholder="Kategori"><textarea id="content" class="input" rows="12" placeholder="Innehåll"></textarea><button id="save" class="btn btn-primary">Spara</button><button id="close" class="btn btn-light">Stäng</button></div></div><script type="module">import{mount}from'./js/layout.js';import{requireRole}from'./js/auth.js';import{get,post,put}from'./js/api.js';import{esc}from'./js/util.js';await requireRole(['admin','agent']);mount('kb.html');let D=[];async function load(){D=await get('/api/kb');render()}function render(){const q=search.value.toLowerCase();cards.innerHTML=D.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q)).map(x=>`<div class="card"><span class="eyebrow">${esc(x.category)}</span><h3>${esc(x.title)}</h3><p>${esc(x.content)}</p><button class="btn btn-light" onclick="editArticle('${x.id}')">Redigera</button></div>`).join('')}function open(x={}){id.value=x.id||'';articleTitle.value=x.title||'';category.value=x.category||'';content.value=x.content||'';modal.classList.add('open')}window.editArticle=i=>open(D.find(x=>x.id===i));newBtn.onclick=()=>open();close.onclick=()=>modal.classList.remove('open');search.oninput=render;save.onclick=async()=>{const b={title:articleTitle.value,category:category.value,content:content.value};id.value?await put('/api/kb/'+id.value,b):await post('/api/kb',b);modal.classList.remove('open');load()};load();</script></body></html>
