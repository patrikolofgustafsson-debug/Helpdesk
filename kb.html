<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kunskapsbas - Eventful Desk</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><script src="api.js"></script><script src="shared.js" defer></script><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');html,body{margin:0;background:#f8fafc;font-family:Inter,sans-serif}body{color:#0f172a}.app{margin-left:16rem;padding:3rem;min-height:100vh}@media(max-width:1024px){.app{margin-left:0;padding:1.5rem}}</style></head><body><main class="app"><div class="flex justify-between mb-8"><div><p class="text-blue-600 text-xs font-black uppercase">Knowledge Base</p><h1 class="text-5xl font-black uppercase italic">Kunskapsbas</h1></div><button onclick="openM()" class="bg-blue-600 text-white px-8 rounded-2xl font-black">Ny artikel</button></div><input id="q" oninput="render()" class="w-full max-w-3xl p-5 bg-white rounded-2xl mb-8" placeholder="Sök..."><div id="grid" class="grid md:grid-cols-3 gap-6"></div></main><div id="m" class="hidden fixed inset-0 bg-slate-900/90 z-50 items-center justify-center"><div class="bg-white p-10 rounded-[3rem] w-full max-w-2xl"><input id="eid" type="hidden"><input id="title" class="w-full p-4 bg-slate-50 rounded-xl mb-3" placeholder="Rubrik"><input id="cat" class="w-full p-4 bg-slate-50 rounded-xl mb-3" placeholder="Kategori"><textarea id="content" class="w-full p-4 bg-slate-50 rounded-xl h-52 mb-3" placeholder="Innehåll"></textarea><button onclick="save()" class="w-full p-4 bg-blue-600 text-white rounded-xl">Spara</button></div></div><script>let K=[];async function init(){const r=await fetch('/api/kb');K=await r.json();render()}function render(){const q=document.getElementById('q').value.toLowerCase();document.getElementById('grid').innerHTML=K.filter(x=>x.title?.toLowerCase().includes(q)).map(x=>`<div class="bg-white p-7 rounded-[2rem]"><span class="text-blue-500 text-[9px] font-black uppercase">${x.category||'Info'}</span><h3 class="text-xl font-black uppercase italic my-3">${x.title}</h3><p class="text-xs text-slate-500">${x.content||''}</p><button onclick="edit('${x.id}')" class="mt-5 text-blue-600 text-xs font-black">Redigera</button></div>`).join('')}function openM(){document.getElementById('m').classList.remove('hidden');document.getElementById('m').classList.add('flex')}function edit(i){const x=K.find(k=>String(k.id)===String(i));eid.value=x.id;title.value=x.title;cat.value=x.category||'';content.value=x.content||'';openM()}async function save(){await fetch('/api/kb/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:eid.value||null,title:title.value,category:cat.value,content:content.value,image:null})});location.reload()}window.onload=init;</script></body></html>
