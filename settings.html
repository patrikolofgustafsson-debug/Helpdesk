<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inställningar - Eventful Desk</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"></head><body><main class="page"><h1 class="title">Inställningar</h1><div class="card stack" style="max-width:700px"><label>Systemnamn<input id="systemName" class="input"></label><label>Standardtjänst<input id="defaultService" class="input"></label><button id="save" class="btn btn-primary">Spara</button><div id="message" class="status"></div></div></main><script type="module">import{mount}from'./js/layout.js';import{requireRole}from'./js/auth.js';import{get,put}from'./js/api.js';import{msg}from'./js/util.js';await requireRole(['admin']);mount('settings.html');const s=await get('/api/settings');systemName.value=s.systemName||'Eventful Desk';defaultService.value=s.defaultService||'Microsoft 365';save.onclick=async()=>{await put('/api/settings',{systemName:systemName.value,defaultService:defaultService.value});msg('Sparat')};</script></body></html>
