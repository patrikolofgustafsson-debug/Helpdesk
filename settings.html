<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inställningar - Eventful Desk</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><script src="api.js"></script><script src="shared.js" defer></script><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');html,body{margin:0;background:#f8fafc;font-family:Inter,sans-serif}body{color:#0f172a}.app{margin-left:16rem;padding:3rem;min-height:100vh}@media(max-width:1024px){.app{margin-left:0;padding:1.5rem}}</style></head><body><main class="app"><h1 class="text-5xl font-black uppercase italic mb-8">Inställningar</h1><div id="unlock" class="bg-white p-8 rounded-[3rem] max-w-xl"><p class="mb-4 text-sm">Administratörsnyckeln lagras endast under denna webbläsarsession.</p><input id="key" type="password" class="w-full p-4 bg-slate-50 rounded-xl mb-3" placeholder="SUPPORT_ADMIN_KEY"><button onclick="setKey()" class="w-full p-4 bg-blue-600 text-white rounded-xl">Lås upp administration</button></div><div id="config" class="hidden bg-white p-8 rounded-[3rem] max-w-2xl"><h2 class="text-xl font-black mb-5">Mailkonfiguration</h2><input id="server" class="w-full p-4 bg-slate-50 rounded-xl mb-3" placeholder="Server"><input id="port" class="w-full p-4 bg-slate-50 rounded-xl mb-3" placeholder="Port"><input id="from" class="w-full p-4 bg-slate-50 rounded-xl mb-3" placeholder="Avsändare"><input id="user" class="w-full p-4 bg-slate-50 rounded-xl mb-3" placeholder="Användarnamn"><button onclick="save()" class="w-full p-4 bg-blue-600 text-white rounded-xl">Spara</button><p class="text-xs text-slate-400 mt-3">Lösenord sparas inte i GitHub. Testmail är inte implementerat i denna version.</p></div></main><script>async function setKey(){sessionStorage.setItem('supportAdminKey',key.value);try{await load()}catch(e){sessionStorage.removeItem('supportAdminKey');alert('Fel adminnyckel')}}async function load(){const r=await fetch('/api/settings');if(!r.ok)throw new Error();const s=await r.json();unlock.classList.add('hidden');config.classList.remove('hidden');server.value=s.mail?.server||'';port.value=s.mail?.port||'587';from.value=s.mail?.from||'';user.value=s.mail?.user||''}async function save(){await fetch('/api/settings/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mail:{server:server.value,port:port.value,from:from.value,user:user.value,ssl:'true'}})});alert('Sparat')}window.onload=()=>{if(sessionStorage.getItem('supportAdminKey'))load().catch(()=>{})}</script></body></html>
