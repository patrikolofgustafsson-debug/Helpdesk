<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Inställningar - Eventful Support</title>
    
    <script>
    // -------------------------------------------------------------------------------------------------------------------------------------
    // SEKTION 1: EXTERNA RESURSER & STILMALLAR
    // -------------------------------------------------------------------------------------------------------------------------------------
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="shared.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; font-style: italic; font-weight: 900; }
        .config-card { font-style: normal; font-weight: 400; }
        /* Stil för systemloggen */
        #system-log { 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 11px; 
            font-weight: 400; 
            font-style: normal; 
            line-height: 1.5;
        }
        .log-entry { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 4px 0; }
        .log-success { color: #10b981; }
        .log-error { color: #ef4444; }
        .log-info { color: #60a5fa; }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 flex">

    <main class="flex-1 ml-64 p-10">
        
        <script>
        // -------------------------------------------------------------------------------------------------------------------------------------
        // SEKTION 2: RUBRIK & ÖVERGRIPANDE LAYOUT
        // -------------------------------------------------------------------------------------------------------------------------------------
        </script>
        <div class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-4xl font-black uppercase text-slate-800 tracking-tighter leading-none">Inställningar</h2>
                <p class="text-slate-400 text-[10px] uppercase tracking-widest mt-2 font-black">Systemadministration & Mailserver</p>
            </div>
            <div id="save-status" class="hidden bg-emerald-50 text-emerald-600 px-6 py-3 rounded-full border border-emerald-100 text-[10px] uppercase font-black">
                <i class="fas fa-check mr-2"></i> Inställningar sparade
            </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
            
            <div class="space-y-8">
                <script>
                // -------------------------------------------------------------------------------------------------------------------------------------
                // SEKTION 3: MAILKONFIGURATION (SMTP)
                // -------------------------------------------------------------------------------------------------------------------------------------
                </script>
                <div class="bg-white p-10 rounded-[3.5rem] shadow-sm border border-slate-100">
                    <div class="flex items-center gap-4 mb-8">
                        <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl">
                            <i class="fas fa-server"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-black uppercase text-slate-800 tracking-tight">SMTP Server</h3>
                            <p class="text-slate-400 text-[10px] uppercase tracking-widest font-black">Konfigurera utgående mail</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 config-card">
                        <div class="space-y-2">
                            <label class="block text-[10px] font-black uppercase text-slate-400 ml-2">Serveradress</label>
                            <input id="mail-server" type="text" placeholder="smtp.office365.com" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none font-bold text-sm">
                        </div>
                        <div class="space-y-2">
                            <label class="block text-[10px] font-black uppercase text-slate-400 ml-2">Port</label>
                            <input id="mail-port" type="number" placeholder="587" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none font-bold text-sm">
                        </div>
                        <div class="space-y-2 md:col-span-2">
                            <label class="block text-[10px] font-black uppercase text-slate-400 ml-2">Användarnamn / Mail</label>
                            <input id="mail-user" type="text" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none font-bold text-sm">
                        </div>
                        <div class="space-y-2 md:col-span-2">
                            <label class="block text-[10px] font-black uppercase text-slate-400 ml-2">Lösenord</label>
                            <input id="mail-pass" type="password" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none font-bold text-sm">
                        </div>
                        <div class="space-y-2">
                            <label class="block text-[10px] font-black uppercase text-slate-400 ml-2">Avsändare (From)</label>
                            <input id="mail-from" type="email" placeholder="support@eventful.se" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none font-bold text-sm">
                        </div>
                        <div class="space-y-2">
                            <label class="block text-[10px] font-black uppercase text-slate-400 ml-2">SSL</label>
                            <select id="mail-ssl" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none font-bold text-sm">
                                <option value="true">Aktiv</option>
                                <option value="false">Inaktiv</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-10 flex gap-4">
                        <button onclick="saveSettings()" class="flex-1 py-5 bg-blue-600 text-white rounded-[2rem] font-black uppercase shadow-xl hover:bg-blue-700 transition text-[10px] tracking-widest">Spara</button>
                        <button onclick="testMail()" class="flex-1 py-5 bg-slate-800 text-white rounded-[2rem] font-black uppercase shadow-lg hover:bg-slate-900 transition text-[10px] tracking-widest">Testa Mail</button>
                    </div>
                </div>
            </div>

            <script>
            // -------------------------------------------------------------------------------------------------------------------------------------
            // SEKTION 4: SYSTEMLOGG (NYTT FÖNSTER)
            // Här visas händelser i systemet och resultat av mailtester.
            // -------------------------------------------------------------------------------------------------------------------------------------
            </script>
            <div class="flex flex-col h-full">
                <div class="bg-slate-900 rounded-[3.5rem] shadow-2xl p-8 flex flex-col h-full border border-slate-800">
                    <div class="flex justify-between items-center mb-6 px-4">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-terminal text-blue-400"></i>
                            <h3 class="text-white text-[10px] uppercase font-black tracking-[0.2em]">Systemlogg</h3>
                        </div>
                        <button onclick="clearLog()" class="text-slate-500 hover:text-white transition text-[8px] uppercase font-black">Rensa</button>
                    </div>
                    
                    <div id="system-log" class="flex-1 bg-black/30 rounded-[2rem] p-6 overflow-y-auto text-slate-400 h-[450px]">
                        <div class="log-entry log-info">> Systemet redo för diagnostik...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // -------------------------------------------------------------------------------------------------------------------------------------
        // SEKTION 5: JAVASCRIPT-LOGIK (MOTORN)
        // -------------------------------------------------------------------------------------------------------------------------------------

        function addLog(message, type = 'info') {
            const log = document.getElementById('system-log');
            const now = new Date().toLocaleTimeString('sv-SE');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.innerHTML = `<span class="opacity-30 mr-2">[${now}]</span> ${message}`;
            log.prepend(entry);
        }

        function clearLog() {
            document.getElementById('system-log').innerHTML = '<div class="log-entry log-info">> Logg rensad. Väntar på händelser...</div>';
        }

        async function loadSettings() {
            addLog("Hämtar konfiguration från servern...");
            try {
                const res = await fetch('/api/settings?t=' + Date.now());
                const settings = await res.json();
                
                if (settings.mail) {
                    document.getElementById('mail-server').value = settings.mail.server || '';
                    document.getElementById('mail-port').value = settings.mail.port || '587';
                    document.getElementById('mail-from').value = settings.mail.from || '';
                    document.getElementById('mail-ssl').value = settings.mail.ssl || 'true';
                    document.getElementById('mail-user').value = settings.mail.user || '';
                    document.getElementById('mail-pass').value = settings.mail.pass || '';
                    addLog("Konfiguration laddad.", "success");
                }
            } catch (e) { addLog("Kunde inte hämta inställningar: " + e, "error"); }
        }

        async function saveSettings() {
            addLog("Sparar inställningar...");
            const settings = {
                mail: {
                    server: document.getElementById('mail-server').value,
                    port: document.getElementById('mail-port').value,
                    from: document.getElementById('mail-from').value,
                    ssl: document.getElementById('mail-ssl').value,
                    user: document.getElementById('mail-user').value,
                    pass: document.getElementById('mail-pass').value
                }
            };

            const res = await fetch('/api/settings/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(settings)
            });

            if (res.ok) {
                addLog("Inställningar sparade på servern.", "success");
                const status = document.getElementById('save-status');
                status.classList.remove('hidden');
                setTimeout(() => status.classList.add('hidden'), 3000);
            } else {
                addLog("Fel vid sparning till server.", "error");
            }
        }

        async function testMail() {
            const email = prompt("Vart ska testmailet skickas?");
            if (!email) return;

            addLog(`Initierar testmail till: ${email}...`);
            addLog(`Ansluter till SMTP-server: ${document.getElementById('mail-server').value}...`);
            
            try {
                const res = await fetch('/api/settings/test-mail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ testEmail: email })
                });
                
                if (res.ok) {
                    addLog("Servern har tagit emot instruktionen. Kontrollerar sändningsstatus...", "info");
                    // Vi kan simulera en väntetid för att det ska se mer levande ut
                    setTimeout(() => {
                        addLog("Testmail skickat! Kontrollera inkorgen (och skräpposten).", "success");
                    }, 1500);
                } else {
                    addLog("Servern svarade med ett felmeddelande.", "error");
                }
            } catch (e) {
                addLog("Kritiskt fel vid anrop till API: " + e, "error");
            }
        }

        window.onload = loadSettings;
    </script>
</body>
</html>
