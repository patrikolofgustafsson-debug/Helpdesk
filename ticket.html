  <style>

    *{box-sizing:border-box} body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.skip-link{position:absolute;left:-9999px}.skip-link:focus{left:16px;top:16px;z-index:100;background:#fff;padding:12px;border-radius:8px}
    .app{min-height:100vh;display:grid;grid-template-columns:272px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;background:var(--nav);color:#fff;padding:28px 20px;display:flex;flex-direction:column}.eyebrow{margin:0;color:#69a4ff;font-weight:900;letter-spacing:.22em;font-size:13px}.brand{margin:8px 0 34px;font-size:26px;line-height:1.15;font-weight:950;font-style:italic}.nav{display:grid;gap:7px}.nav a{color:#9fb2cd;text-decoration:none;padding:13px 15px;border-radius:14px;font-weight:850}.nav a:hover,.nav a:focus-visible{background:var(--nav2);color:#fff}.nav a.active{background:var(--blue);color:#fff}.nav-section{margin:22px 14px 7px;color:#6f87a8;font-size:11px;font-weight:900;letter-spacing:.16em}.logout{margin-top:auto;border:0;background:var(--nav2);color:#dce7f8;padding:14px;border-radius:14px;font-weight:850;cursor:pointer}.main{min-width:0;padding:34px clamp(20px,4vw,58px) 70px}.back{display:inline-flex;gap:8px;align-items:center;color:#36506f;font-weight:850;text-decoration:none;margin-bottom:22px}.ticket-head{display:flex;align-items:start;justify-content:space-between;gap:20px;margin-bottom:24px}.ticket-head h1{margin:6px 0 7px;font-size:clamp(32px,4vw,52px);line-height:1.04;letter-spacing:-.035em}.ticket-id{font-weight:900;color:var(--blue);letter-spacing:.08em}.head-meta{color:var(--muted);font-weight:700}.head-actions{display:flex;gap:10px}.button{border:0;border-radius:13px;padding:12px 17px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}.button.primary{background:var(--blue);color:#fff}.button.secondary{background:#fff;color:#263b59;border:1px solid var(--line)}.button:disabled{opacity:.58;cursor:wait}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.8fr);gap:24px;align-items:start}.card{background:#fff;border:1px solid #e7edf5;border-radius:24px;padding:24px;box-shadow:var(--shadow)}.card+.card{margin-top:20px}.card h2{margin:0 0 17px;font-size:22px}.description{white-space:pre-wrap;color:#334155}.customer-line{display:flex;gap:18px;flex-wrap:wrap;color:#64748b;margin-top:17px}.customer-line strong{color:#243753}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:17px;flex-wrap:wrap}.segmented{display:flex;gap:5px;background:#f0f4f9;padding:4px;border-radius:12px;overflow:auto}.segmented button{border:0;background:transparent;padding:8px 11px;border-radius:9px;color:#53647a;font-weight:850;white-space:nowrap;cursor:pointer}.segmented button.active{background:#fff;color:#184fc5;box-shadow:0 2px 8px rgba(15,23,42,.09)}.timeline{position:relative;margin-top:7px}.timeline:before{content:"";position:absolute;left:20px;top:12px;bottom:12px;width:2px;background:#d9e4f1}.event{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr);gap:14px;padding:0 0 20px}.event:last-child{padding-bottom:0}.event-icon{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#edf2f7;border:4px solid #fff;color:#52647b;font-weight:900}.event.reply .event-icon{background:#e8efff;color:#2457bd}.event.note .event-icon{background:#dcecff;color:#1756c5}.event.change .event-icon{background:#f1ecff;color:#6a3cc0}.event.created .event-icon{background:#e5f7ed;color:#14824b}.event-body{border:1px solid #e3eaf3;border-radius:16px;padding:15px 16px;background:#fff}.event.note .event-body{background:var(--note);border-color:var(--note-border)}.event.change .event-body{background:#faf8ff}.event-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px}.event-title{font-weight:900}.event-time{color:#6c7d93;font-size:13px;white-space:nowrap}.event-actor{color:#62748b;font-size:13px;font-weight:750}.event-text{white-space:pre-wrap;margin-top:9px;color:#28384e}.change-list{display:grid;gap:7px;margin-top:9px}.change-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.old,.new{border-radius:8px;padding:3px 7px;font-size:13px;font-weight:800}.old{background:#edf1f6;color:#59677b;text-decoration:line-through}.new{background:#e3ebff;color:#2252b7}.timeline-empty{padding:28px;text-align:center;color:var(--muted)}
    .composer-tabs{display:flex;gap:7px;margin-bottom:14px}.composer-tabs button{border:1px solid var(--line);background:#fff;color:#42546d;border-radius:11px;padding:9px 13px;font-weight:850;cursor:pointer}.composer-tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.composer textarea{width:100%;min-height:125px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:14px;outline:none}.composer textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(45,103,238,.11)}.composer.note-mode{background:var(--note);border:1px solid var(--note-border);border-radius:18px;padding:16px}.private-hint{display:none;color:#2356a6;font-size:13px;font-weight:800;margin:0 0 10px}.note-mode .private-hint{display:block}.composer-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.feedback{font-weight:800;font-size:14px}.feedback.error{color:var(--danger)}.feedback.success{color:var(--success)}
    .side-card{position:sticky;top:24px}.form-grid{display:grid;gap:15px}.field label{display:block;margin-bottom:6px;color:#52647d;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.field select,.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;outline:none}.field select:focus,.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(45,103,238,.11)}.save-row{display:flex;align-items:center;gap:12px;margin-top:19px}.facts{margin:22px 0 0;border-top:1px solid #e9eef5;padding-top:17px;display:grid;gap:10px}.fact{display:flex;justify-content:space-between;gap:14px}.fact dt{color:#66768b}.fact dd{margin:0;text-align:right;font-weight:800}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}.status-open{background:#e6f7ee;color:#137a42}.status-progress{background:#e8efff;color:#2457bd}.status-waiting{background:#fff5d9;color:#986b00}.status-closed{background:#edf0f5;color:#516075}.loading,.error-state{background:#fff;border-radius:24px;padding:50px;text-align:center;box-shadow:var(--shadow)}.spinner{width:34px;height:34px;border:4px solid #dbe7ff;border-top-color:var(--blue);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}.error-state{color:var(--danger)}.hidden{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:1050px){.layout{grid-template-columns:1fr}.side-card{position:static}.ticket-head{display:block}.head-actions{margin-top:15px}}
    @media(max-width:820px){.app{display:block}.sidebar{position:static;height:auto;padding:16px 18px}.brand{margin-bottom:12px}.nav{display:flex;overflow:auto;padding-bottom:4px}.nav a{white-space:nowrap}.nav-section{display:none}.logout{margin-top:12px;width:100%}.main{padding:26px 15px 48px}.card{padding:19px;border-radius:20px}.ticket-head h1{font-size:34px}.event-top{display:block}.event-time{display:block;margin-top:3px}.toolbar{align-items:start}.segmented{max-width:100%}}
  </style>

<body>
<a class="skip-link" href="#content">Hoppa till innehåll</a>
<div class="app">
  <aside id="app-sidebar" class="kb-sidebar" aria-label="Huvudmeny"></aside>
  <main class="main" id="content">
    <a class="back" href="tickets.html">← Tillbaka till ärenden</a>
    <div id="pageState"><div class="loading"><div class="spinner"></div>Hämtar ärendet…</div></div>
    <div id="ticketPage" class="hidden">
      <header class="ticket-head"><div><div class="ticket-id" id="ticketId"></div><h1 id="ticketSubject"></h1><div class="head-meta" id="headMeta"></div></div><div class="head-actions"><button class="button secondary" id="reloadButton" type="button">↻ Uppdatera</button></div></header>
      <div class="layout">
        <div>
          <section class="card" aria-labelledby="descriptionHeading"><h2 id="descriptionHeading">Beskrivning</h2><div class="description" id="description"></div><div class="customer-line" id="customerLine"></div></section>
          <section class="card" aria-labelledby="historyHeading">
            <div class="toolbar"><h2 id="historyHeading">Ärendehistorik</h2><div class="segmented" id="timelineFilters" aria-label="Filtrera ärendehistorik"><button class="active" data-filter="all" type="button">Alla</button><button data-filter="reply" type="button">Svar</button><button data-filter="note" type="button">Interna</button><button data-filter="change" type="button">Ändringar</button></div><button class="button secondary" id="timelineOrder" type="button">Nyast först ↓</button></div>
            <div class="timeline" id="timeline"></div>
          </section>
          <section class="card" aria-labelledby="composerHeading"><h2 id="composerHeading">Lägg till i ärendet</h2><div class="composer-tabs" role="tablist"><button class="active" id="replyTab" type="button" role="tab" aria-selected="true">Svar till kund</button><button id="noteTab" type="button" role="tab" aria-selected="false">Intern anteckning</button></div><div class="composer" id="composer"><p class="private-hint">🔒 Endast synlig för agenter och administratörer</p><label class="sr-only" for="messageText">Text</label><textarea id="messageText" placeholder="Skriv ett svar till kunden…"></textarea><div class="composer-actions"><span class="feedback" id="messageFeedback" aria-live="polite"></span><button class="button primary" id="sendButton" type="button">Skicka svar</button></div></div></section>
        </div>
        <aside class="card side-card" aria-labelledby="detailsHeading"><h2 id="detailsHeading">Ärendedetaljer</h2><div class="form-grid"><div class="field"><label for="statusSelect">Status</label><select id="statusSelect"></select></div><div class="field"><label for="prioritySelect">Prioritet</label><select id="prioritySelect"></select></div><div class="field"><label for="agentSelect">Agent</label><select id="agentSelect"><option value="">Ej tilldelad</option></select></div><div class="field"><label for="serviceSelect">Tjänst</label><select id="serviceSelect"></select></div><div class="field"><label for="categorySelect">Kategori</label><select id="categorySelect"></select></div></div><div class="save-row"><button class="button primary" id="saveButton" type="button">Spara ändringar</button><span class="feedback" id="saveFeedback" aria-live="polite"></span></div><dl class="facts"><div class="fact"><dt>Skapat</dt><dd id="createdAt">–</dd></div><div class="fact"><dt>Senast uppdaterat</dt><dd id="updatedAt">–</dd></div><div class="fact"><dt>Kund</dt><dd id="customerName">–</dd></div></dl></aside>
      </div>
    </div>
  </main>
</div>
<script type="module">
  import * as apiModule from "./js/api.js";
  import * as authModule from "./js/auth.js";
  import * as configModule from "./js/config.js";

  const $=id=>document.getElementById(id);const els={state:$('pageState'),page:$('ticketPage'),id:$('ticketId'),subject:$('ticketSubject'),headMeta:$('headMeta'),description:$('description'),customerLine:$('customerLine'),timeline:$('timeline'),filters:$('timelineFilters'),order:$('timelineOrder'),replyTab:$('replyTab'),noteTab:$('noteTab'),composer:$('composer'),text:$('messageText'),send:$('sendButton'),messageFeedback:$('messageFeedback'),status:$('statusSelect'),priority:$('prioritySelect'),agent:$('agentSelect'),service:$('serviceSelect'),category:$('categorySelect'),save:$('saveButton'),saveFeedback:$('saveFeedback'),created:$('createdAt'),updated:$('updatedAt'),customer:$('customerName'),reload:$('reloadButton'),logout:null};
  const ticketId=new URLSearchParams(location.search).get('id');let ticket=null;let agents=[];let settings={};let composerMode='reply';let timelineFilter='all';let newestFirst=true;
  const fieldLabels={status:'Status',priority:'Prioritet',assignedAgentName:'Agent',service:'Tjänst',category:'Kategori'};const statusLabels={open:'Öppen',new:'Ny',inprogress:'Pågår',in_progress:'Pågår',pending:'Väntar',waiting:'Väntar',resolved:'Löst',closed:'Stängd'};const priorityLabels={urgent:'Akut',high:'Hög',normal:'Normal',medium:'Normal',low:'Låg'};
  function esc(value=''){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}function key(value=''){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[\s-]+/g,'');}function arrayValue(v){return Array.isArray(v)?v:[]}function uniq(v){return[...new Set(v.filter(Boolean).map(x=>String(x).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'sv'));}function asDate(v){const d=v?new Date(v):null;return d&&!Number.isNaN(d.valueOf())?d:null;}function dateText(v){const d=asDate(v);return d?new Intl.DateTimeFormat('sv-SE',{dateStyle:'medium',timeStyle:'short'}).format(d):'–';}function label(map,value){return map[key(value)]||value||'–';}
  function authState(){for(const name of Object.keys(localStorage)){try{const value=JSON.parse(localStorage.getItem(name));if(value&&typeof value==='object'&&(value.token||value.user))return value;}catch{}}return null;}
  async function request(path,options={}){const fn=apiModule.api||apiModule.request||apiModule.apiFetch||apiModule.default;if(typeof fn==='function'){const result=await fn(path,options);if(result instanceof Response){const text=await result.text();let data=null;try{data=text?JSON.parse(text):null;}catch{data=text;}if(!result.ok)throw new Error(data?.error||data||`HTTP ${result.status}`);return data;}return result;}const base=String(configModule.API_BASE||'').replace(/\/$/,'');const state=authState();const headers={...(options.body?{'Content-Type':'application/json'}:{}),...(state?.token?{Authorization:`Bearer ${state.token}`} : {}),...(options.headers||{})};const response=await fetch(base+path,{...options,headers});const text=await response.text();let data=null;try{data=text?JSON.parse(text):null;}catch{data=text;}if(!response.ok)throw new Error(data?.error||data||`HTTP ${response.status}`);return data;}
  function getUser(){try{return (authModule.getSession?.()||authModule.session?.()||authState())?.user||authModule.getUser?.()||null;}catch{return authState()?.user||null;}}const currentUser=getUser()||{};
  async function logout(){if(!confirm('Vill du logga ut?'))return;try{if(typeof authModule.logout==='function')await authModule.logout();else if(typeof authModule.clearSession==='function')authModule.clearSession();else localStorage.clear();}finally{location.href='login.html';}}
  function option(select,value,text=value){if(![...select.options].some(o=>String(o.value)===String(value))){const o=document.createElement('option');o.value=value;o.textContent=text;select.append(o);}}
  function fillSelect(select,values,current,labels={}){select.innerHTML='';for(const value of uniq([...values,current]))option(select,value,labels[key(value)]||value);select.value=current||'';}
  function assignedAgentName(){return ticket.assignedAgentName||ticket.agentName||agents.find(a=>String(a.id)===String(ticket.assignedAgentId||ticket.agentId))?.name||'';}
  function setupForm(){
    fillSelect(els.status,['Open','In progress','Pending','Resolved','Closed'],ticket.status||'Open',statusLabels);fillSelect(els.priority,['Low','Normal','High','Urgent'],ticket.priority||'Normal',priorityLabels);
    els.agent.innerHTML='<option value="">Ej tilldelad</option>';for(const a of agents)option(els.agent,a.id,a.name||a.email||a.id);const agentId=ticket.assignedAgentId||ticket.agentId||'';if(agentId)option(els.agent,agentId,assignedAgentName()||agentId);els.agent.value=agentId;
    const services=arrayValue(settings.services||settings.serviceOptions);const categories=arrayValue(settings.categories||settings.categoryOptions);fillSelect(els.service,[...services,ticket.service,'Övrigt'],ticket.service||settings.defaultService||'Övrigt');fillSelect(els.category,[...categories,ticket.category,'Övrigt'],ticket.category||'');const emptyCategory=document.createElement('option');emptyCategory.value='';emptyCategory.textContent='Ingen kategori';els.category.prepend(emptyCategory);els.category.value=ticket.category||'';
  }
  function renderTicket(){els.id.textContent=`ÄRENDE #${ticket.id}`;els.subject.textContent=ticket.subject||ticket.title||'Utan ämne';document.title=`#${ticket.id} ${ticket.subject||ticket.title||'Ärende'} · Eventful Desk`;els.description.textContent=ticket.description||'Ingen beskrivning.';els.headMeta.innerHTML=`<span class="badge ${statusClass(ticket.status)}">${esc(label(statusLabels,ticket.status))}</span> &nbsp; ${esc(label(priorityLabels,ticket.priority))} prioritet · ${esc(assignedAgentName()||'Ej tilldelad')}`;const customer=ticket.customerName||ticket.customer?.name||'Okänd kund';els.customerLine.innerHTML=`<span><strong>Kund:</strong> ${esc(customer)}</span>${ticket.customerEmail?`<span><strong>E-post:</strong> ${esc(ticket.customerEmail)}</span>`:''}${ticket.service?`<span><strong>Tjänst:</strong> ${esc(ticket.service)}</span>`:''}`;els.created.textContent=dateText(ticket.createdAt);els.updated.textContent=dateText(ticket.updatedAt||ticket.createdAt);els.customer.textContent=customer;setupForm();renderTimeline();}
  function statusClass(v){const k=key(v);if(['closed','resolved','stangd','lost'].includes(k))return'status-closed';if(['inprogress','pagar'].includes(k))return'status-progress';if(['pending','waiting','vantar'].includes(k))return'status-waiting';return'status-open';}
  function eventDate(item){return item.createdAt||item.timestamp||item.date||item.sentAt||item.updatedAt||ticket.createdAt;}
  function actor(item,fallback){return item.authorName||item.actorName||item.createdByName||item.author||item.actor||item.senderName||item.userName||fallback||'Systemet';}
  function timelineEvents(){
    const events=[];if(ticket.createdAt)events.push({id:'created',type:'created',createdAt:ticket.createdAt,actor:ticket.customerName||'Systemet',title:'Ärendet skapades',text:ticket.description||''});
    for(const [index,m] of arrayValue(ticket.messages||ticket.replies||ticket.comments).entries())events.push({id:m.id||`message-${index}-${eventDate(m)}`,type:'reply',createdAt:eventDate(m),actor:actor(m,m.fromCustomer?ticket.customerName:'Support'),title:m.fromCustomer||m.role==='customer'?'Svar från kund':'Svar till kund',text:m.text||m.message||m.body||m.content||''});
    for(const [index,n] of arrayValue(ticket.internalNotes||ticket.notes).entries())events.push({id:n.id||`note-${index}-${eventDate(n)}`,type:'note',createdAt:eventDate(n),actor:actor(n,'Support'),title:'Intern anteckning',text:n.text||n.note||n.body||n.content||''});
    for(const [index,h] of arrayValue(ticket.history||ticket.events||ticket.activity).entries()){const changes=h.changes||((h.field||h.fieldName)?[{field:h.field||h.fieldName,from:h.from??h.oldValue,to:h.to??h.newValue}]:[]);events.push({id:h.id||`history-${index}-${eventDate(h)}`,type:h.type==='created'?'created':'change',createdAt:eventDate(h),actor:actor(h,'Systemet'),title:h.title||h.label||'Ärendet uppdaterades',text:h.text||h.description||'',changes});}
    const seen=new Set();return events.filter(e=>{const signature=e.id||`${e.type}|${e.createdAt}|${e.actor}|${e.text}`;if(seen.has(signature))return false;seen.add(signature);return true;});
  }
  function renderTimeline(){let events=timelineEvents().filter(e=>timelineFilter==='all'||e.type===timelineFilter||(timelineFilter==='change'&&e.type==='created'));events.sort((a,b)=>(asDate(a.createdAt)?.valueOf()||0)-(asDate(b.createdAt)?.valueOf()||0));if(newestFirst)events.reverse();els.timeline.innerHTML=events.length?events.map(eventHtml).join(''):'<div class="timeline-empty">Inga händelser matchar filtret.</div>';}
  function eventHtml(e){const icon={reply:'↗',note:'🔒',change:'↻',created:'＋'}[e.type]||'•';const changes=arrayValue(e.changes);return `<article class="event ${esc(e.type)}"><div class="event-icon" aria-hidden="true">${icon}</div><div class="event-body"><div class="event-top"><div><div class="event-title">${esc(e.title)}</div><div class="event-actor">${esc(e.actor)}</div></div><time class="event-time" datetime="${esc(e.createdAt||'')}">${esc(dateText(e.createdAt))}</time></div>${e.text?`<div class="event-text">${esc(e.text)}</div>`:''}${changes.length?`<div class="change-list">${changes.map(changeHtml).join('')}</div>`:''}</div></article>`;}
  function changeHtml(c){const field=c.field||c.name||'';return `<div class="change-row"><strong>${esc(fieldLabels[field]||field||'Fält')}</strong><span class="old">${esc(displayValue(field,c.from??c.oldValue))}</span><span aria-hidden="true">→</span><span class="new">${esc(displayValue(field,c.to??c.newValue))}</span></div>`;}
  function displayValue(field,value){if(value==null||value==='')return'Ej angivet';if(field==='status')return label(statusLabels,value);if(field==='priority')return label(priorityLabels,value);return String(value);}
  function setComposer(mode){composerMode=mode;const note=mode==='note';els.replyTab.classList.toggle('active',!note);els.noteTab.classList.toggle('active',note);els.replyTab.setAttribute('aria-selected',String(!note));els.noteTab.setAttribute('aria-selected',String(note));els.composer.classList.toggle('note-mode',note);els.text.placeholder=note?'Skriv en intern anteckning…':'Skriv ett svar till kunden…';els.send.textContent=note?'Spara intern anteckning':'Skicka svar';els.messageFeedback.textContent='';}
  function feedback(el,message,type=''){el.textContent=message;el.className=`feedback ${type}`;}
  async function sendMessage(){const text=els.text.value.trim();if(!text){feedback(els.messageFeedback,'Skriv en text först.','error');els.text.focus();return;}els.send.disabled=true;feedback(els.messageFeedback,composerMode==='note'?'Sparar…':'Skickar…');try{const path=`/api/tickets/${encodeURIComponent(ticket.id)}/${composerMode==='note'?'notes':'messages'}`;await request(path,{method:'POST',body:JSON.stringify({text,message:text,note:text,body:text})});els.text.value='';feedback(els.messageFeedback,composerMode==='note'?'Den interna anteckningen har sparats.':'Svaret har skickats.','success');await load(false);}catch(error){feedback(els.messageFeedback,error.message||String(error),'error');}finally{els.send.disabled=false;}}
  function formChanges(){const agent=agents.find(a=>String(a.id)===String(els.agent.value));const next={status:els.status.value,priority:els.priority.value,assignedAgentId:els.agent.value||null,assignedAgentName:agent?.name||(els.agent.value?els.agent.options[els.agent.selectedIndex]?.textContent:'')||'',service:els.service.value,category:els.category.value};const before={status:ticket.status||'',priority:ticket.priority||'',assignedAgentName:assignedAgentName(),service:ticket.service||'',category:ticket.category||''};const changes=[];for(const field of ['status','priority','assignedAgentName','service','category'])if(String(before[field]||'')!==String(next[field]||''))changes.push({field,from:before[field]||'',to:next[field]||''});return{next,changes};}
  async function saveDetails(){const {next,changes}=formChanges();if(!changes.length){feedback(els.saveFeedback,'Inga ändringar att spara.');return;}els.save.disabled=true;feedback(els.saveFeedback,'Sparar…');const now=new Date().toISOString();const historyEvent={id:`change-${Date.now()}`,type:'change',createdAt:now,actorName:currentUser.name||'Support',title:'Ärendedetaljer uppdaterades',changes};const updated={...ticket,...next,updatedAt:now,history:[...arrayValue(ticket.history),historyEvent]};try{const result=await request(`/api/tickets/${encodeURIComponent(ticket.id)}`,{method:'PUT',body:JSON.stringify(updated)});ticket=result?.ticket||result||updated;feedback(els.saveFeedback,'Sparat.','success');renderTicket();}catch(error){feedback(els.saveFeedback,error.message||String(error),'error');}finally{els.save.disabled=false;}}
  async function load(showLoading=true){if(!ticketId){els.state.innerHTML='<div class="error-state"><strong>Ärende-ID saknas.</strong><br>Öppna ärendet från ärendelistan.</div>';return;}if(showLoading){els.page.classList.add('hidden');els.state.classList.remove('hidden');els.state.innerHTML='<div class="loading"><div class="spinner"></div>Hämtar ärendet…</div>';}els.reload.disabled=true;try{const [ticketData,agentData,settingsData]=await Promise.all([request(`/api/tickets/${encodeURIComponent(ticketId)}`),request('/api/agents').catch(()=>[]),request('/api/settings').catch(()=>({}))]);ticket=ticketData?.ticket||ticketData;agents=arrayValue(agentData?.agents||agentData);settings=settingsData||{};if(!ticket||!ticket.id)throw new Error('Ärendet hittades inte.');renderTicket();els.state.classList.add('hidden');els.page.classList.remove('hidden');}catch(error){els.state.classList.remove('hidden');els.page.classList.add('hidden');els.state.innerHTML=`<div class="error-state"><strong>Kunde inte hämta ärendet.</strong><br>${esc(error.message||error)}</div>`;}finally{els.reload.disabled=false;}}

  els.reload.addEventListener('click',()=>load(false));els.replyTab.addEventListener('click',()=>setComposer('reply'));els.noteTab.addEventListener('click',()=>setComposer('note'));els.send.addEventListener('click',sendMessage);els.save.addEventListener('click',saveDetails);els.filters.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{timelineFilter=b.dataset.filter;els.filters.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));renderTimeline();}));els.order.addEventListener('click',()=>{newestFirst=!newestFirst;els.order.textContent=newestFirst?'Nyast först ↓':'Äldst först ↑';renderTimeline();});els.text.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')sendMessage();});load();
</script>
  <script src="sidebar.js"></script>
</body>
