<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ärende - Eventful Desk</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"></head><body><main class="page"><p><a href="tickets.html">← Tillbaka</a></p><h1 id="heading" class="title" style="font-size:38px">Ärende</h1><div class="grid grid-2"><div><div class="card"><p id="desc"></p></div><div id="timeline" class="grid" style="margin-top:20px"></div><div class="card stack" style="margin-top:20px"><textarea id="reply" class="input" rows="5" placeholder="Svara kunden..."></textarea><button id="send" class="btn btn-primary">Skicka svar</button><textarea id="note" class="input" rows="3" placeholder="Intern anteckning..."></textarea><button id="addNote" class="btn btn-light">Lägg intern anteckning</button><div id="message" class="status"></div></div></div><div class="card stack" style="height:max-content"><label>Status<select id="status" class="input"><option>Open</option><option>Pending</option><option>Resolved</option></select></label><label>Prioritet<select id="priority" class="input"><option>Low</option><option>Normal</option><option>High</option><option>Urgent</option></select></label><label>Agent<select id="agent" class="input"></select></label><label>Tjänst<input id="service" class="input"></label><label>Kategori<input id="category" class="input"></label><button id="save" class="btn btn-primary">Spara</button></div></div></main><script type="module">import{mount}from'./js/layout.js';import{requireRole,user}from'./js/auth.js';import{get,put,post}from'./js/api.js';import{esc,date,qs,msg}from'./js/util.js';await requireRole(['admin','agent']);mount('tickets.html');const id=qs('id');let t=await get('/api/tickets/'+encodeURIComponent(id));const agents=await get('/api/agents');function draw(){heading.textContent='#'+t.id+' '+t.subject;desc.textContent=t.description;status.value=t.status;priority.value=t.priority;service.value=t.service||'';category.value=t.category||'';agent.innerHTML='<option value="">Otilldelat</option>'+agents.map(a=>`<option value="${a.id}" ${a.id===t.assignedAgentId?'selected':''}>${esc(a.name)}</option>`).join('');timeline.innerHTML=[...(t.messages||[]).map(x=>({...x,type:'Svar'})),...(t.internalNotes||[]).map(x=>({...x,type:'Internt'}))].sort((a,b)=>a.createdAt.localeCompare(b.createdAt)).map(x=>`<div class="card"><small>${esc(x.type)} · ${esc(x.authorName)} · ${date(x.createdAt)}</small><p>${esc(x.text)}</p></div>`).join('')}save.onclick=async()=>{try{t=await put('/api/tickets/'+encodeURIComponent(id),{status:status.value,priority:priority.value,service:service.value,category:category.value,assignedAgentId:agent.value||null});msg('Sparat');draw()}catch(e){msg(e.message,true)}};send.onclick=async()=>{if(!reply.value.trim())return;t=await post('/api/tickets/'+encodeURIComponent(id)+'/messages',{text:reply.value});reply.value='';draw()};addNote.onclick=async()=>{if(!note.value.trim())return;t=await post('/api/tickets/'+encodeURIComponent(id)+'/notes',{text:note.value});note.value='';draw()};draw();</script></body></html>
