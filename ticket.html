<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ärende - Eventful Desk</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head>
<body><main class="page"><p><a href="tickets.html">← Tillbaka</a></p><h1 id="heading" class="title" style="font-size:38px">Ärende</h1><div class="grid grid-2"><div><div class="card"><p id="desc"></p></div><div id="timeline" class="grid" style="margin-top:20px"></div><div class="card stack" style="margin-top:20px"><textarea id="reply" class="input" rows="5" placeholder="Svara kunden..."></textarea><button id="send" class="btn btn-primary">Skicka svar</button><textarea id="note" class="input" rows="3" placeholder="Intern anteckning..."></textarea><button id="addNote" class="btn btn-light">Lägg intern anteckning</button><div id="message" class="status"></div></div></div><div class="card stack" style="height:max-content"><label>Status<select id="status" class="input"><option>Open</option><option>Pending</option><option>Resolved</option></select></label><label>Prioritet<select id="priority" class="input"><option>Low</option><option>Normal</option><option>High</option><option>Urgent</option></select></label><label>Agent<select id="agent" class="input"></select></label><label>Tjänst<select id="service" class="input"></select></label><label>Kategori<select id="category" class="input"></select></label><button id="save" class="btn btn-primary">Spara</button></div></div></main>
<script type="module">
import{mount}from'./js/layout.js';import{requireRole,user}from'./js/auth.js';import{get,put,post}from'./js/api.js';import{esc,date,qs}from'./js/util.js';
await requireRole(['admin','agent']);mount('tickets.html');const id=qs('id');let currentUser=user(),ticket=await get('/api/tickets/'+encodeURIComponent(id));const [agents,settings]=await Promise.all([get('/api/agents'),get('/api/settings')]);
const serviceEl=document.getElementById('service'),categoryEl=document.getElementById('category'),agentEl=document.getElementById('agent'),statusEl=document.getElementById('status'),priorityEl=document.getElementById('priority'),messageEl=document.getElementById('message');
function optionList(values,current,empty){let vals=[...(values||[])];if(current&&!vals.includes(current))vals.unshift(current);return (empty?`<option value="">${empty}</option>`:'')+vals.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
function draw(){heading.textContent='#'+ticket.id+' '+ticket.subject;desc.textContent=ticket.description||'';statusEl.value=ticket.status||'Open';priorityEl.value=ticket.priority||'Normal';agentEl.innerHTML='<option value="">Otilldelat</option>'+agents.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');agentEl.value=ticket.assignedAgentId||'';serviceEl.innerHTML=optionList(settings.services,ticket.service,'Välj tjänst');serviceEl.value=ticket.service||'';categoryEl.innerHTML=optionList(settings.categories,ticket.category,'Välj kategori');categoryEl.value=ticket.category||'';timeline.innerHTML=[...(ticket.messages||[]).map(x=>({...x,type:'Svar'})),...(ticket.internalNotes||[]).map(x=>({...x,type:'Internt'}))].sort((a,b)=>a.createdAt.localeCompare(b.createdAt)).map(x=>`<div class="card"><small>${esc(x.type)} · ${esc(x.authorName)} · ${date(x.createdAt)}</small><p>${esc(x.text)}</p></div>`).join('')}
async function saveTicket(){try{ticket=await put('/api/tickets/'+encodeURIComponent(id),{status:statusEl.value,priority:priorityEl.value,service:serviceEl.value,category:categoryEl.value,assignedAgentId:agentEl.value||null});messageEl.textContent='Sparat.';draw()}catch(e){messageEl.textContent=e.message;messageEl.classList.add('error')}}
document.getElementById('save').onclick=saveTicket;document.getElementById('send').onclick=async()=>{const el=document.getElementById('reply');if(!el.value.trim())return;ticket=await post('/api/tickets/'+encodeURIComponent(id)+'/messages',{text:el.value});el.value='';draw()};document.getElementById('addNote').onclick=async()=>{const el=document.getElementById('note');if(!el.value.trim())return;ticket=await post('/api/tickets/'+encodeURIComponent(id)+'/notes',{text:el.value});el.value='';draw()};draw();
</script></body></html>
