<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8"><title>Dashboard - Eventful</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="shared.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; font-style: italic; font-weight: 900; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 flex">
    <main class="flex-1 ml-64 p-10">
        <h2 class="text-4xl mb-8 uppercase font-black text-slate-800">Dashboard</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
            <div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-slate-200">
                <p class="text-slate-400 text-xs uppercase mb-2">Totalt ärenden</p>
                <p id="stat-total" class="text-7xl font-black text-slate-800">0</p>
            </div>
            <div class="bg-blue-600 p-10 rounded-[2.5rem] shadow-lg text-white">
                <p class="text-blue-200 text-xs uppercase mb-2">Öppna just nu</p>
                <p id="stat-open" class="text-7xl font-black">0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            <div class="lg:col-span-2">
                <h3 class="text-xl font-black uppercase text-slate-500 mb-6 tracking-widest">Fördelning per tjänst</h3>
                <div id="service-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>
            <div>
                <h3 class="text-xl font-black uppercase text-slate-500 mb-6 tracking-widest">Topp 5 Företag</h3>
                <div id="company-list" class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm space-y-4"></div>
            </div>
        </div>
    </main>

    <script>
        async function initDashboard() {
            try {
                const [tRes, cRes] = await Promise.all([
                    fetch('/api/tickets?t=' + Date.now()),
                    fetch('/api/customers?t=' + Date.now())
                ]);
                
                const tData = await tRes.json();
                const cData = await cRes.json();
                
                allTickets = Array.isArray(tData) ? tData : [tData];
                allCustomers = Array.isArray(cData) ? cData : [cData];

                document.getElementById('stat-total').innerText = allTickets.length;
                document.getElementById('stat-open').innerText = allTickets.filter(t => t.status === 'Open').length;

                const svcs = ["Integration och identitet", "DNP", "Microsoft", "Google", "Modern Arbetsplats", "Konsulting", "Freshdesk", "Övrigt"];
                const sCounts = {}; svcs.forEach(s => sCounts[s] = 0);
                const compCounts = {};

                allTickets.forEach(t => {
                    if(sCounts.hasOwnProperty(t.service)) sCounts[t.service]++; else sCounts["Övrigt"]++;
                    const customer = allCustomers.find(c => c.name === t.customer);
                    const company = customer ? customer.company : "Okänt företag";
                    compCounts[company] = (compCounts[company] || 0) + 1;
                });

                document.getElementById('service-grid').innerHTML = svcs.map(s => `
                    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                        <p class="text-[10px] uppercase text-slate-400 font-black mb-1 truncate">${s}</p>
                        <p class="text-3xl font-black text-slate-800">${sCounts[s]}</p>
                    </div>
                `).join('');

                const topComps = Object.entries(compCounts).sort((a,b) => b[1]-a[1]).slice(0,5);
                document.getElementById('company-list').innerHTML = topComps.map(([name, count], i) => `
                    <div class="flex justify-between items-center border-b border-slate-50 pb-2">
                        <div class="flex items-center"><span class="text-blue-500 mr-3 text-xs">#${i+1}</span><span class="text-slate-700 truncate font-black">${name}</span></div>
                        <span class="bg-slate-100 px-3 py-1 rounded-full text-xs font-black">${count} st</span>
                    </div>
                `).join('');
            } catch(e) { console.error("Dashboard init fel:", e); }
        }
        window.onload = initDashboard;
    </script>
</body>
</html>
