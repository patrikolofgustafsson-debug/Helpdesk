<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard - Eventful Desk</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><script src="api.js"></script><script src="shared.js" defer></script><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');html,body{margin:0;background:#f8fafc;font-family:Inter,sans-serif}body{color:#0f172a}.app{margin-left:16rem;padding:3rem;min-height:100vh}@media(max-width:1024px){.app{margin-left:0;padding:1.5rem}}</style></head><body><main class="app"><h1 class="text-6xl font-black italic uppercase mb-10">Dashboard</h1><div class="grid md:grid-cols-2 gap-6 mb-12"><div class="bg-white p-10 rounded-[2.5rem] shadow-sm"><p class="text-xs uppercase text-slate-400 font-black">Totalt ärenden</p><p id="total" class="text-7xl font-black">0</p></div><div class="bg-blue-600 text-white p-10 rounded-[2.5rem] shadow-xl"><p class="text-xs uppercase text-blue-200 font-black">Öppna just nu</p><p id="open" class="text-7xl font-black">0</p></div></div><h2 class="text-xl uppercase font-black text-slate-500 mb-4">Fördelning per tjänst</h2><div id="services" class="grid md:grid-cols-3 gap-4 mb-10"></div><h2 class="text-xl uppercase font-black text-slate-500 mb-4">Topp 5 företag</h2><div id="companies" class="bg-white p-8 rounded-[2.5rem] max-w-2xl"></div></main><script>async function init(){const[t,c]=await Promise.all([fetch('/api/tickets?t='+Date.now()),fetch('/api/customers?t='+Date.now())]);const ts=await t.json(),cs=await c.json();document.getElementById('total').textContent=ts.length;document.getElementById('open').textContent=ts.filter(x=>x.status==='Open').length;const sc={},cc={};ts.forEach(x=>{sc[x.service||'Övrigt']=(sc[x.service||'Övrigt']||0)+1;const cu=cs.find(c=>c.name===x.customer);const co=cu?.company||'Okänt företag';cc[co]=(cc[co]||0)+1});document.getElementById('services').innerHTML=Object.entries(sc).map(([n,c])=>`<div class="bg-white p-6 rounded-3xl"><p class="text-[10px] uppercase text-slate-400 font-black">${n}</p><p class="text-3xl font-black">${c}</p></div>`).join('');document.getElementById('companies').innerHTML=Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,c],i)=>`<div class="flex justify-between border-b py-3"><b>#${i+1} ${n}</b><span>${c} st</span></div>`).join('')}window.onload=init;</script></body></html>
