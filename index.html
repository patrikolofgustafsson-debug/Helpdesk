<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard - Eventful Desk</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">  <link rel="stylesheet" href="sidebar.css">
</head><body><div class="app-shell"><aside id="app-sidebar" class="kb-sidebar" aria-label="Huvudmeny"></aside><main class="page"><p class="eyebrow">Support management</p><h1 class="title">Dashboard</h1><div class="metrics"><div class="card metric"><span>Totalt ärenden</span><strong id="total">0</strong></div><div class="card metric blue"><span>Öppna just nu</span><strong id="open">0</strong></div><div class="card metric"><span>Väntande</span><strong id="pending">0</strong></div></div><div class="grid grid-2" style="margin-top:28px"><div class="card"><h2>Fördelning per tjänst</h2><div id="services"></div></div><div class="card"><h2>Toppföretag</h2><div id="companies"></div></div></div></main></div><script type="module">import{requireRole}from'./js/auth.js';import{get}from'./js/api.js';import{esc}from'./js/util.js';await requireRole(['admin','agent']);const d=await get('/api/dashboard');total.textContent=d.total;open.textContent=d.open;pending.textContent=d.pending;services.innerHTML=Object.entries(d.byService).map(([n,c])=>`<p><b>${esc(n)}</b><span style="float:right">${c}</span></p>`).join('');companies.innerHTML=d.topCompanies.map(x=>`<p><b>${esc(x.name)}</b><span style="float:right">${x.count}</span></p>`).join('');</script>  <script src="sidebar.js"></script>
</body></html>
