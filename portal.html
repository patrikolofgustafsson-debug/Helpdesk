<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mina ärenden - Eventful Desk</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"></head><body><main style="max-width:1000px;margin:40px auto;padding:20px"><div class="toolbar"><h1 class="title" style="flex:1">Mina ärenden</h1><button id="logout" class="btn btn-light">Logga ut</button></div><div id="list" class="grid"></div></main><script type="module">import{requireRole,logout}from'./js/auth.js';import{get}from'./js/api.js';import{esc,date}from'./js/util.js';await requireRole(['customer']);logout.onclick=logout;const a=await get('/api/portal/tickets');list.innerHTML=a.length?a.map(x=>`<a href="portal-ticket.html?id=${x.id}" class="card" style="text-decoration:none;color:inherit"><b>#${x.id} ${esc(x.subject)}</b><span style="float:right" class="pill ${x.status.toLowerCase()}">${x.status}</span><p>${date(x.updatedAt)}</p></a>`).join(''):'<div class="card">Inga ärenden.</div>';</script></body></html>
