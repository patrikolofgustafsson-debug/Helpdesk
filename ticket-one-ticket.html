<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ärende - Eventful Desk</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><script src="api.js"></script><script src="shared.js" defer></script><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');html,body{margin:0;background:#f8fafc;font-family:Inter,sans-serif}body{color:#0f172a}.app{margin-left:16rem;padding:3rem;min-height:100vh}@media(max-width:1024px){.app{margin-left:0;padding:1.5rem}}</style></head><body><main class="app"><button onclick="location.href='tickets.html'" class="mb-6 text-slate-400 font-black">Tillbaka</button><h1 id="title" class="text-5xl font-black uppercase italic mb-8"></h1><div class="grid lg:grid-cols-[1fr_320px] gap-8"><div><div class="bg-white p-8 rounded-[3rem] mb-6"><p id="desc"></p></div><div class="bg-white p-8 rounded-[3rem]"><textarea id="reply" class="w-full p-5 bg-slate-50 rounded-2xl h-32" placeholder="Svara kund..."></textarea><button onclick="send()" class="mt-4 bg-blue-600 text-white px-8 py-4 rounded-xl">Skicka svar</button></div><div id="hist" class="space-y-4 mt-6"></div></div><div class="bg-white p-7 rounded-[3rem] h-fit"><label>Status</label><select id="status" onchange="save()" class="w-full p-4 bg-slate-50 rounded-xl my-2"><option>Open</option><option>Pending</option><option>Resolved</option></select><label>Agent</label><select id="agent" onchange="save()" class="w-full p-4 bg-slate-50 rounded-xl my-2"></select><label>Tjänst</label><select id="service" onchange="save()" class="w-full p-4 bg-slate-50 rounded-xl my-2"><option>Microsoft</option><option>Google</option><option>DNP</option><option>Hårdvara</option><option>Övrigt</option></select></div></div></main><script>let T,U;const tid=new URLSearchParams(location.search).get('id');async function init(){U=JSON.parse(localStorage.getItem('loggedUser')||'{"name":"Agent"}');const[t,a]=await Promise.all([fetch('/api/tickets'),fetch('/api/agents')]);const ts=await t.json(),as=await a.json();T=ts.find(x=>x.id==tid);if(!T)return;title.textContent='#'+T.id+' '+T.title;desc.textContent=T.desc||'';status.value=T.status||'Open';service.value=T.service||'Microsoft';agent.innerHTML='<option value="">Otilldelat</option>'+as.map(x=>`<option ${x.name===T.agent?'selected':''}>${x.name}</option>`).join('');render()}function render(){hist.innerHTML=(T.replies||[]).slice().reverse().map(x=>`<div class="bg-white p-5 rounded-2xl"><b>${x.agent||'Kund'}</b><p>${x.text||''}</p></div>`).join('')}async function save(){T.status=status.value;T.service=service.value;T.agent=agent.value;await fetch('/api/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(T)})}async function send(){if(!reply.value.trim())return;T.replies=T.replies||[];T.replies.push({date:new Date().toLocaleString('sv-SE'),agent:U.name,text:reply.value.trim()});reply.value='';await save();render()}window.onload=init;</script></body></html>
