<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kunder - Eventful Desk</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<main class="page">
  <div class="toolbar">
    <h1 class="title" style="flex:1">Kunder</h1>
    <button id="newBtn" class="btn btn-primary">Ny kund</button>
  </div>
  <div id="pageMessage" class="status"></div>
  <div id="cards" class="grid grid-2"></div>
</main>

<div id="modal" class="modal">
  <div class="modal-box stack">
    <h2 id="modalTitle">Kund</h2>
    <input id="customerId" type="hidden">
    <input id="customerName" class="input" placeholder="Namn">
    <input id="customerCompany" class="input" placeholder="Företag">
    <input id="customerEmail" class="input" placeholder="E-post">
    <input id="customerPassword" type="password" class="input" placeholder="Tillfälligt lösenord">
    <button id="saveBtn" class="btn btn-primary">Spara</button>
    <button id="closeBtn" class="btn btn-light">Stäng</button>
    <div id="modalMessage" class="status"></div>
  </div>
</div>

<script type="module">
import { mount } from './js/layout.js';
import { requireRole } from './js/auth.js';
import { get, post, put } from './js/api.js';
import { esc } from './js/util.js';

await requireRole(['admin', 'agent']);
mount('customers.html');

const cardsEl = document.getElementById('cards');
const pageMessageEl = document.getElementById('pageMessage');
const modalEl = document.getElementById('modal');
const modalTitleEl = document.getElementById('modalTitle');
const idEl = document.getElementById('customerId');
const nameEl = document.getElementById('customerName');
const companyEl = document.getElementById('customerCompany');
const emailEl = document.getElementById('customerEmail');
const passwordEl = document.getElementById('customerPassword');
const newBtnEl = document.getElementById('newBtn');
const saveBtnEl = document.getElementById('saveBtn');
const closeBtnEl = document.getElementById('closeBtn');
const modalMessageEl = document.getElementById('modalMessage');

let customers = [];

function showPageMessage(text, error = false) {
  pageMessageEl.textContent = text;
  pageMessageEl.classList.toggle('error', error);
}
function showModalMessage(text, error = false) {
  modalMessageEl.textContent = text;
  modalMessageEl.classList.toggle('error', error);
}
function renderCustomers() {
  cardsEl.innerHTML = customers.length ? customers.map(customer => `
    <div class="card">
      <h3>${esc(customer.name)}</h3>
      <p>${esc(customer.company || '')}</p>
      <p>${esc(customer.email || '')}</p>
      <button class="btn btn-light" data-action="edit" data-id="${esc(customer.id)}">Redigera</button>
    </div>
  `).join('') : '<div class="card">Inga kunder skapade ännu.</div>';

  cardsEl.querySelectorAll('[data-action="edit"]').forEach(button => {
    button.addEventListener('click', () => openEdit(button.dataset.id));
  });
}
async function loadCustomers() {
  try {
    customers = await get('/api/customers');
    renderCustomers();
  } catch (error) {
    showPageMessage(error.message, true);
  }
}
function resetForm() {
  idEl.value = '';
  nameEl.value = '';
  companyEl.value = '';
  emailEl.value = '';
  passwordEl.value = '';
  showModalMessage('');
}
function openNew() {
  resetForm();
  modalTitleEl.textContent = 'Ny kund';
  passwordEl.placeholder = 'Tillfälligt lösenord';
  modalEl.classList.add('open');
  nameEl.focus();
}
function openEdit(id) {
  const customer = customers.find(item => String(item.id) === String(id));
  if (!customer) {
    showPageMessage('Kunden kunde inte hittas.', true);
    return;
  }
  resetForm();
  modalTitleEl.textContent = 'Redigera kund';
  idEl.value = customer.id;
  nameEl.value = customer.name || '';
  companyEl.value = customer.company || '';
  emailEl.value = customer.email || '';
  passwordEl.placeholder = 'Nytt lösenord (lämna tomt för att behålla)';
  modalEl.classList.add('open');
  nameEl.focus();
}
function closeModal() { modalEl.classList.remove('open'); }
async function saveCustomer() {
  const id = idEl.value.trim();
  const payload = {
    name: nameEl.value.trim(),
    company: companyEl.value.trim(),
    email: emailEl.value.trim()
  };
  if (passwordEl.value) payload.password = passwordEl.value;
  if (!payload.name || !payload.email) {
    showModalMessage('Namn och e-post måste fyllas i.', true);
    return;
  }
  saveBtnEl.disabled = true;
  saveBtnEl.textContent = 'Sparar...';
  try {
    let saved;
    if (id) {
      saved = await put('/api/customers/' + encodeURIComponent(id), payload);
      const index = customers.findIndex(item => String(item.id) === String(id));
      if (index >= 0) customers[index] = saved;
      else customers.push(saved);
      showPageMessage('Kunden har uppdaterats.');
    } else {
      saved = await post('/api/customers', payload);
      customers.push(saved);
      showPageMessage('Kunden har skapats.');
    }
    renderCustomers();
    closeModal();
  } catch (error) {
    showModalMessage(error.message, true);
  } finally {
    saveBtnEl.disabled = false;
    saveBtnEl.textContent = 'Spara';
  }
}

newBtnEl.addEventListener('click', openNew);
closeBtnEl.addEventListener('click', closeModal);
saveBtnEl.addEventListener('click', saveCustomer);
modalEl.addEventListener('click', e => { if (e.target === modalEl) closeModal(); });

await loadCustomers();
</script>
</body>
</html>
