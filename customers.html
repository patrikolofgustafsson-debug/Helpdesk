<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8"><title>Kunder - Eventful</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="shared.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; font-style: italic; font-weight: 900; }
        .modal-active { display: flex !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 flex">
    <main class="flex-1 ml-64 p-10">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-4xl font-black uppercase">Kundregister</h2>
            <button onclick="openModal('customerModal')" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-black shadow-lg uppercase text-xs">Ny kund</button>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-sm border overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b text-slate-400 text-[10px] uppercase">
                    <tr><th class="p-6">Namn / Titel</th><th class="p-6">Företag</th><th class="p-6">E-post</th><th class="p-6 text-right">Åtgärd</th></tr>
                </thead>
                <tbody id="customerList" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </main>

    <div id="customerModal" class="fixed inset-0 bg-slate-900/90 hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-12 shadow-2xl font-black">
            <h3 class="text-2xl font-black mb-8 uppercase text-center">Kunduppgifter</h3>
            <div class="space-y-4">
                <input id="c-name" type="text" placeholder="Namn" class="w-full p-5 bg-slate-50 rounded-2xl border outline-none font-black">
                <input id="c-company" type="text" placeholder="Företag" class="w-full p-5 bg-slate-50 rounded-2xl border outline-none font-black">
                <input id="c-email" type="email" placeholder="E-post" class="w-full p-5 bg-slate-50 rounded-2xl border outline-none font-black">
                <div class="flex gap-4 pt-6">
                    <button onclick="closeModal('customerModal')" class="flex-1 py-5">Avbryt</button>
                    <button onclick="saveCustomer()" class="flex-1 py-5 bg-blue-600 text-white rounded-2xl">Spara</button>
                </div>
            </div>
        </div>
    </div>

    <div id="historyModal" class="fixed inset-0 bg-slate-900/90 hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-4xl rounded-[3rem] p-12 shadow-2xl flex flex-col max-h-[80vh]">
            <h3 id="hist-name" class="text-3xl font-black uppercase mb-6"></h3>
            <div class="overflow-y-auto">
                <table class="w-full text-left">
                    <thead class="border-b text-[10px] uppercase text-slate-400">
                        <tr><th class="p-4">ID</th><th class="p-4">Ämne</th><th class="p-4">Status</th><th class="p-4">Datum</th></tr>
                    </thead>
                    <tbody id="historyBody" class="divide-y"></tbody>
                </table>
            </div>
            <button onclick="closeModal('historyModal')" class="mt-8 py-4 bg-slate-100 rounded-2xl uppercase text-xs font-black">Stäng</button>
        </div>
    </div>

    <script>
        async function init() {
            const [cRes, tRes] = await Promise.all([fetch('/api/customers'), fetch('/api/tickets')]);
            allCustomers = await cRes.json(); allTickets = await tRes.json();
            render();
        }

        function render() {
            document.getElementById('customerList').innerHTML = allCustomers.map(c => `
                <tr class="hover:bg-slate-50 border-b font-black">
                    <td class="p-6">
                        <div onclick="showHistory('${c.name}')" class="cursor-pointer text-blue-600 underline">${c.name}</div>
                    </td>
                    <td class="p-6 uppercase text-xs text-slate-500">${c.company}</td>
                    <td class="p-6 text-slate-400">${c.email}</td>
                    <td class="p-6 text-right">
                        <button onclick="deleteCustomer('${c.email}')" class="text-red-400"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`).join('');
        }

        function showHistory(name) {
            const hist = allTickets.filter(t => t.customer === name);
            document.getElementById('hist-name').innerText = "Historik: " + name;
            document.getElementById('historyBody').innerHTML = hist.map(t => `
                <tr><td class="p-4">#${t.id}</td><td class="p-4">${t.title}</td><td class="p-4">${t.status}</td><td class="p-4 text-xs">${t.created || ''}</td></tr>
            `).join('');
            openModal('historyModal');
        }

        async function saveCustomer() {
            const d = { name: document.getElementById('c-name').value, company: document.getElementById('c-company').value, email: document.getElementById('c-email').value, id: document.getElementById('c-email').value };
            await fetch('/api/customers/create', { method: 'POST', body: JSON.stringify(d) });
            location.reload();
        }

        async function deleteCustomer(email) {
            if(confirm("Radera kund?")) {
                await fetch('/api/customers/delete', { method: 'POST', body: JSON.stringify({email}) });
                location.reload();
            }
        }
        window.onload = init;
    </script>
</body>
</html>
