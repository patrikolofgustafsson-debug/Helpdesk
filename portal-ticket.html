<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ärende - Kundportal</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"></head><body><main style="max-width:900px;margin:40px auto;padding:20px"><p><a href="portal.html">← Tillbaka</a></p><h1 id="heading" class="title" style="font-size:36px"></h1><div id="timeline" class="grid"></div><div class="card stack" style="margin-top:20px"><textarea id="reply" class="input" rows="5"></textarea><button id="send" class="btn btn-primary">Skicka svar</button></div></main><script type="module">import{requireRole}from'./js/auth.js';import{get,post}from'./js/api.js';import{qs,esc,date}from'./js/util.js';await requireRole(['customer']);const id=qs('id');let t=await get('/api/portal/tickets/'+id);function draw(){heading.textContent='#'+t.id+' '+t.subject;timeline.innerHTML=`<div class="card"><p>${esc(t.description)}</p></div>`+(t.messages||[]).map(x=>`<div class="card"><small>${esc(x.authorName)} · ${date(x.createdAt)}</small><p>${esc(x.text)}</p></div>`).join('')}send.onclick=async()=>{if(!reply.value.trim())return;t=await post('/api/portal/tickets/'+id+'/messages',{text:reply.value});reply.value='';draw()};draw();</script></body></html>
