<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logga in - Eventful Desk</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><script src="api.js"></script><script src="shared.js" defer></script><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');html,body{margin:0;background:#f8fafc;font-family:Inter,sans-serif}body{color:#0f172a}.app{margin-left:16rem;padding:3rem;min-height:100vh}@media(max-width:1024px){.app{margin-left:0;padding:1.5rem}}</style></head><body class="min-h-screen flex"><div class="w-full lg:w-[42%] bg-white p-10 lg:p-20 flex items-center"><div class="w-full max-w-md mx-auto"><p class="text-blue-600 text-xs uppercase tracking-[.3em] font-black italic">Support Portal</p><h1 class="text-5xl font-black uppercase italic mb-10">Logga in</h1><label class="text-[10px] font-black uppercase text-slate-400">Namn eller E-post</label><input id="user" class="w-full p-5 bg-slate-50 rounded-2xl mt-3 mb-4" placeholder="Skriv här..."><button onclick="login()" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase">Logga in</button><p id="err" class="hidden text-red-500 text-xs font-black mt-4">Hittade ingen användare.</p></div></div><div class="hidden lg:block flex-1 bg-slate-50 p-20"><h2 class="text-3xl font-black uppercase italic mb-8">Hjälpcenter</h2><div id="kb"></div></div><script>async function login(){const v=document.getElementById('user').value.trim().toLowerCase();const[a,c]=await Promise.all([fetch('/api/agents'),fetch('/api/customers')]);const as=await a.json(),cs=await c.json();const ag=as.find(x=>x.name?.toLowerCase()===v||x.email?.toLowerCase()===v);if(ag){localStorage.setItem('loggedUser',JSON.stringify({name:ag.name,role:'agent'}));location.href='tickets.html';return}const cu=cs.find(x=>x.name?.toLowerCase()===v||x.email?.toLowerCase()===v);if(cu){localStorage.setItem('loggedUser',JSON.stringify({name:cu.name,role:'customer'}));location.href='customer-tickets.html';return}document.getElementById('err').classList.remove('hidden')}async function kb(){const r=await fetch('/api/kb');const a=await r.json();document.getElementById('kb').innerHTML=a.slice(0,3).map(x=>`<div class="bg-white p-6 rounded-3xl mb-4"><b>${x.title}</b><p class="text-xs text-slate-400 mt-2">${x.content||''}</p></div>`).join('')}window.onload=kb;</script></body></html>
