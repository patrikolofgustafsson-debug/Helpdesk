<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logga in - Eventful Desk</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
.login-page{max-width:1180px;margin:5vh auto;padding:24px}.login-layout{display:grid;grid-template-columns:380px 1fr;gap:34px;align-items:start}.login-card,.kb-card{background:#fff;border-radius:30px;padding:28px;box-shadow:0 10px 40px #0f172a0c}.login-title{font-size:42px;font-weight:900;font-style:italic;text-transform:uppercase;margin:14px 0 26px}.login-form{display:grid;gap:12px}.login-input{width:100%;padding:15px 17px;border:1px solid #dbe3ef;border-radius:15px}.login-button{border:0;border-radius:15px;padding:15px 20px;background:#2563eb;color:#fff;font-weight:900;text-transform:uppercase;cursor:pointer}.admin-link{border:0;background:transparent;text-align:left;color:#475569;font-weight:800;cursor:pointer;padding:8px 0}.admin-box{display:none;margin-top:8px}.admin-box.open{display:grid;gap:10px}.login-message{min-height:20px;margin-top:10px;color:#b91c1c;font-weight:800;font-size:13px}.articles-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}.articles-head h2{margin:0;font-size:32px;font-weight:900;font-style:italic;text-transform:uppercase}.all-kb{color:#2563eb;font-weight:900;text-decoration:none}.article-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.article{display:block;text-decoration:none;color:inherit;border:1px solid #e2e8f0;border-radius:22px;padding:20px;transition:.15s}.article:hover{border-color:#60a5fa;transform:translateY(-2px);box-shadow:0 8px 25px #2563eb12}.article small{color:#2563eb;text-transform:uppercase;font-weight:900}.article h3{margin:8px 0;font-size:18px}.article p{color:#64748b;font-size:13px;margin:0}.empty{padding:28px;border:1px dashed #cbd5e1;border-radius:22px;color:#64748b}.public-intro{color:#64748b;margin:4px 0 0}.brandline{color:#2563eb;font-size:11px;font-weight:900;letter-spacing:.25em;text-transform:uppercase}@media(max-width:850px){.login-layout{grid-template-columns:1fr}.article-grid{grid-template-columns:1fr}.login-card{max-width:460px;width:100%;margin:auto}}
</style></head>
<body>
<main class="login-page">
  <div class="login-layout">
    <section class="login-card">
      <div id="brand" class="brandline">Support Portal</div>
      <h1 class="login-title">Logga in</h1>
      <form id="loginForm" class="login-form">
        <input id="email" class="login-input" type="email" autocomplete="username" placeholder="E-post">
        <input id="password" class="login-input" type="password" autocomplete="current-password" placeholder="Lösenord">
        <button id="loginBtn" class="login-button" type="submit">Logga in</button>
      </form>
      <button id="toggleAdmin" class="admin-link" type="button"><i class="fa fa-lock"></i> Administratörsinloggning</button>
      <div id="adminBox" class="admin-box"><input id="adminKey" class="login-input" type="password" placeholder="ADMIN_KEY"><button id="adminBtn" class="login-button" type="button">Administratörsinloggning</button></div>
      <div id="message" class="login-message"></div>
    </section>

    <section class="kb-card">
      <div class="articles-head"><div><div class="brandline">Självhjälp</div><h2>Supportartiklar</h2><p class="public-intro">Vanliga guider och lösningar som går att läsa utan inloggning.</p></div><a class="all-kb" href="public-kb.html">Visa hela supportbanken →</a></div>
      <div id="articles" class="article-grid"><div class="empty">Laddar publika supportartiklar…</div></div>
    </section>
  </div>
</main>
<script type="module">
import { loginEmail, loginAdmin } from './js/auth.js';
import { API_BASE } from './js/config.js';
const $=id=>document.getElementById(id),msg=$('message');
function show(t){msg.textContent=t||''}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function excerpt(a){const raw=String(a.summary||a.excerpt||a.content||a.html||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();return raw.length>150?raw.slice(0,147)+'…':raw}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();show('');$('loginBtn').disabled=true;try{const u=await loginEmail($('email').value.trim(),$('password').value);location.href=u.role==='customer'?'portal.html':'index.html'}catch(err){show(err.message)}finally{$('loginBtn').disabled=false}});
$('toggleAdmin').onclick=()=>$('adminBox').classList.toggle('open');
$('adminBtn').onclick=async()=>{show('');try{const u=await loginAdmin($('adminKey').value.trim());location.href=u.role==='customer'?'portal.html':'index.html'}catch(err){show(err.message)}};
async function loadArticles(){try{const r=await fetch(API_BASE+'/api/public/kb',{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const list=Array.isArray(data)?data:(data.articles||data.items||[]);const picks=list.slice(0,4);$('articles').innerHTML=picks.length?picks.map(a=>`<a class="article" href="public-kb-article.html?id=${encodeURIComponent(a.id)}"><small>${esc(a.category||'Support')}</small><h3>${esc(a.title||'Artikel')}</h3><p>${esc(excerpt(a))}</p></a>`).join(''):'<div class="empty">Det finns inga publika artiklar ännu.</div>'}catch(err){console.error(err);$('articles').innerHTML='<div class="empty">Supportartiklarna kunde inte laddas just nu. <a href="public-kb.html">Öppna hela supportbanken</a>.</div>'}}
try{const r=await fetch(API_BASE+'/api/public/settings');if(r.ok){const s=await r.json();if(s.systemName){document.title='Logga in - '+s.systemName;$('brand').textContent=s.systemName}}}catch{}
loadArticles();
</script></body></html>
