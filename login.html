<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logga in - Eventful Desk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .kb-card:hover { transform: translateX(6px); transition: all 0.2s ease; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <div class="w-full md:w-[45%] bg-white flex flex-col justify-center p-8 sm:p-12 md:p-20 border-r border-slate-100">
        <div class="max-w-md w-full mx-auto">
            <div class="mb-12">
                <h2 class="text-blue-600 text-[12px] font-black uppercase tracking-[0.3em] mb-2 italic">Support Portal</h2>
                <h1 class="text-5xl font-black text-slate-800 uppercase tracking-tighter italic leading-none">Logga in</h1>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-3 block ml-2 tracking-widest">Namn eller E-post</label>
                    <input type="text" id="username" placeholder="Skriv här..." class="w-full p-6 bg-slate-50 rounded-2xl border-none font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>

                <button onclick="handleLogin()" class="w-full bg-[#2563EB] text-white py-6 rounded-2xl font-black uppercase text-[12px] tracking-widest shadow-xl hover:bg-blue-700 transition-all transform active:scale-95">
                    Logga in
                </button>
                
                <p id="error-msg" class="text-red-500 text-[10px] font-black uppercase text-center mt-4 italic hidden">
                    <i class="fas fa-exclamation-triangle mr-1"></i> Hittade ingen användare med de uppgifterna
                </p>
            </div>
        </div>
    </div>

    <div class="w-full md:w-[55%] bg-slate-50 flex flex-col justify-center p-8 sm:p-12 md:p-20 overflow-y-auto">
        <div class="max-w-xl w-full mx-auto">
            <div class="flex justify-between items-center mb-10">
                <div>
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] block mb-1">Hjälpcenter</span>
                    <h2 class="text-3xl font-black text-slate-800 uppercase tracking-tighter italic">Populära artiklar</h2>
                </div>
                <button onclick="window.location.href='kb.html'" class="bg-white border border-slate-200/60 px-5 py-3 rounded-xl text-[9px] font-black uppercase tracking-widest text-slate-500 hover:text-blue-600 shadow-sm transition-all flex items-center gap-2">
                    <i class="fas fa-book text-blue-500"></i> Visa alla
                </button>
            </div>

            <div id="popular-articles" class="space-y-4">
                <p class="text-slate-400 italic text-xs">Hämtar hjälpartiklar...</p>
            </div>
        </div>
    </div>

    <script>
        async function handleLogin() {
            const input = document.getElementById('username').value.trim().toLowerCase();
            const errorEl = document.getElementById('error-msg');
            
            if (!input) return;
            errorEl.classList.add('hidden');

            try {
                const [agentsRes, customersRes] = await Promise.all([
                    fetch('/api/agents?t=' + Date.now()),
                    fetch('/api/customers?t=' + Date.now())
                ]);

                const agents = await agentsRes.json();
                const customers = await customersRes.json();

                // 1. Kolla Agenter
                const agent = agents.find(a => 
                    (a.name && a.name.toLowerCase() === input) || 
                    (a.email && a.email.toLowerCase() === input)
                );
                if (agent) {
                    localStorage.setItem('loggedUser', JSON.stringify({ name: agent.name, role: 'agent' }));
                    window.location.href = 'tickets.html';
                    return;
                }

                // 2. Kolla Kunder
                const customer = customers.find(c => 
                    (c.name && c.name.toLowerCase() === input) || 
                    (c.email && c.email.toLowerCase() === input)
                );
                if (customer) {
                    localStorage.setItem('loggedUser', JSON.stringify({ name: customer.name, role: 'customer' }));
                    window.location.href = 'customer-tickets.html';
                    return;
                }

                errorEl.classList.remove('hidden');

            } catch (err) {
                console.error("Login Error:", err);
                alert("Servern svarar inte. Kontrollera att PowerShell körs.");
            }
        }

        // HÄMTA ARTIKLAR FRÅN KB.JSON
async function loadPopularArticles() {
    try {
        const res = await fetch('/api/kb?t=' + Date.now());
        const articles = await res.json();
        const container = document.getElementById('popular-articles');

        if (!articles || articles.length === 0) {
            container.innerHTML = '<p class="text-slate-400 italic text-xs">Inga artiklar publicerade ännu.</p>';
            return;
        }

        // Visar de 3 senaste/första artiklarna med bildstöd
        container.innerHTML = articles.slice(0, 3).map(art => {
            // Kolla om artikeln innehåller en Base64-bild eller länk
            const hasImage = art.image || art.file;
            const isImage = hasImage && hasImage.startsWith('data:image/');

            return `
                <div onclick="window.location.href='kb.html'" class="kb-card bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm cursor-pointer transition-all flex items-center gap-6 group">
                    
                    <div class="w-20 h-20 rounded-2xl bg-slate-50 flex-shrink-0 overflow-hidden flex items-center justify-center border border-slate-100">
                        ${isImage 
                            ? `<img src="${hasImage}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">` 
                            : `<i class="fas fa-file-alt text-2xl text-slate-300 group-hover:text-blue-500 transition-colors"></i>`
                        }
                    </div>

                    <div class="flex-1 min-w-0">
                        <span class="text-[9px] font-black text-blue-500 uppercase tracking-widest">${art.service || 'Allmänt'}</span>
                        <h3 class="text-base font-black text-slate-800 uppercase italic mt-0.5 leading-tight group-hover:text-blue-600 transition-colors truncate">${art.title}</h3>
                        <p class="text-slate-400 text-xs mt-1 line-clamp-2 font-medium leading-relaxed">${art.desc || art.content || ''}</p>
                    </div>

                    <div class="flex-shrink-0 pl-2">
                        <i class="fas fa-chevron-right text-slate-200 group-hover:text-blue-500 group-hover:translate-x-1 transition-all"></i>
                    </div>
                </div>
            `;
        }).join('');

    } catch (err) {
        console.error("Kunde inte ladda KB:", err);
        document.getElementById('popular-articles').innerHTML = '<p class="text-slate-400 italic text-xs">Kunde inte ladda supportartiklar just nu.</p>';
    }
}

        // Körs när sidan laddas
        window.onload = () => {
            loadPopularArticles();
        };
    </script>
</body>
</html>
