<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logga in - Eventful Desk</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
.login-wrap{max-width:560px;margin:7vh auto;padding:24px}.login-card{background:#fff;border-radius:42px;padding:42px;box-shadow:0 14px 45px #0f172a12}.login-title{font-size:64px;font-weight:900;font-style:italic;margin:26px 0 44px;text-transform:uppercase}.login-form{display:grid;gap:18px}.login-input{width:100%;padding:22px;border:1px solid #dbe3ef;border-radius:22px;font-size:20px}.login-button{justify-self:start;border:0;border-radius:20px;padding:20px 30px;background:#2563eb;color:#fff;font-weight:900;font-size:18px;text-transform:uppercase;cursor:pointer}.login-button:disabled{opacity:.6}.sep{border:0;border-top:1px solid #aaa;margin:28px 0}.admin-button{border:0;background:transparent;font-weight:900;font-size:18px;text-transform:uppercase;cursor:pointer;padding:14px 0;text-align:left}.login-message{min-height:24px;margin-top:16px;font-weight:800;color:#b91c1c}.login-message.ok{color:#166534}@media(max-width:650px){.login-card{padding:26px}.login-title{font-size:46px}}
</style>
</head>
<body>
<main class="login-wrap">
  <section class="login-card">
    <p class="eyebrow">Support Portal</p>
    <h1 class="login-title">Logga in</h1>

    <form id="loginForm" class="login-form" novalidate>
      <input id="emailInput" class="login-input" type="email" autocomplete="username" placeholder="E-post">
      <input id="passwordInput" class="login-input" type="password" autocomplete="current-password" placeholder="Lösenord">
      <button id="loginButton" class="login-button" type="submit">Logga in</button>
    </form>

    <hr class="sep">

    <div class="login-form">
      <input id="adminKeyInput" class="login-input" type="password" autocomplete="off" placeholder="ADMIN_KEY för första uppstart">
      <button id="adminLoginButton" class="admin-button" type="button">Administratörsinloggning</button>
    </div>

    <div id="loginMessage" class="login-message" role="alert"></div>
  </section>
</main>

<script type="module">
import { loginEmail, loginAdmin, user } from './js/auth.js';

const form = document.getElementById('loginForm');
const emailInput = document.getElementById('emailInput');
const passwordInput = document.getElementById('passwordInput');
const loginButton = document.getElementById('loginButton');
const adminKeyInput = document.getElementById('adminKeyInput');
const adminLoginButton = document.getElementById('adminLoginButton');
const messageEl = document.getElementById('loginMessage');

function showMessage(text, ok = false) {
  messageEl.textContent = text || '';
  messageEl.classList.toggle('ok', ok);
}

function redirectUser(loggedInUser) {
  if (!loggedInUser) return;
  location.href = loggedInUser.role === 'customer' ? 'portal.html' : 'index.html';
}

async function doLogin(event) {
  event.preventDefault();
  showMessage('');

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    showMessage('Fyll i e-post och lösenord.');
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = 'Loggar in...';

  try {
    const loggedInUser = await loginEmail(email, password);
    showMessage('Inloggningen lyckades.', true);
    redirectUser(loggedInUser);
  } catch (error) {
    console.error('Login failed:', error);
    showMessage(error.message || 'Inloggningen misslyckades.');
  } finally {
    loginButton.disabled = false;
    loginButton.textContent = 'Logga in';
  }
}

async function doAdminLogin() {
  showMessage('');
  const key = adminKeyInput.value.trim();
  if (!key) {
    showMessage('Fyll i ADMIN_KEY.');
    return;
  }

  adminLoginButton.disabled = true;
  adminLoginButton.textContent = 'Loggar in...';

  try {
    const loggedInUser = await loginAdmin(key);
    showMessage('Administratörsinloggningen lyckades.', true);
    redirectUser(loggedInUser);
  } catch (error) {
    console.error('Admin login failed:', error);
    showMessage(error.message || 'Administratörsinloggningen misslyckades.');
  } finally {
    adminLoginButton.disabled = false;
    adminLoginButton.textContent = 'Administratörsinloggning';
  }
}

form.addEventListener('submit', doLogin);
adminLoginButton.addEventListener('click', doAdminLogin);
</script>
</body>
</html>
