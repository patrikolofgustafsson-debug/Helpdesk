<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logga in - Eventful Desk</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"></head><body><main style="max-width:520px;margin:8vh auto;padding:24px"><div class="card"><p class="eyebrow">Support portal</p><h1 class="title" style="font-size:42px">Logga in</h1><div class="stack"><input id="email" class="input" placeholder="E-post"><input id="password" type="password" class="input" placeholder="Lösenord"><button id="login" class="btn btn-primary">Logga in</button><hr><input id="admin" type="password" class="input" placeholder="ADMIN_KEY för första uppstart"><button id="adminLogin" class="btn btn-light">Administratörsinloggning</button><div id="message" class="status"></div></div></div></main><script type="module">import{loginEmail,loginAdmin}from'./js/auth.js';import{$,msg}from'./js/util.js';login.onclick=async()=>{try{const u=await loginEmail(email.value,password.value);location.href=u.role==='customer'?'portal.html':'index.html'}catch(e){msg(e.message,true)}};adminLogin.onclick=async()=>{try{await loginAdmin(admin.value);location.href='index.html'}catch(e){msg(e.message,true)}};</script></body></html>
