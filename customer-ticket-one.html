<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ärende - Supportportal</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><script src="api.js"></script><script src="shared.js" defer></script><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');html,body{margin:0;background:#f8fafc;font-family:Inter,sans-serif}body{color:#0f172a}.app{margin-left:16rem;padding:3rem;min-height:100vh}@media(max-width:1024px){.app{margin-left:0;padding:1.5rem}}</style></head><body class="p-6 md:p-12"><div class="max-w-4xl mx-auto"><button onclick="location.href='customer-tickets.html'" class="mb-8 text-slate-400 font-black">Tillbaka</button><h1 id="title" class="text-4xl font-black uppercase italic mb-8"></h1><div class="bg-white p-8 rounded-[3rem] mb-6"><p id="desc"></p></div><div id="hist" class="space-y-4 mb-8"></div><div class="bg-white p-8 rounded-[3rem]"><textarea id="reply" class="w-full p-5 bg-slate-50 rounded-2xl h-32" placeholder="Skriv svar..."></textarea><button onclick="send()" class="mt-4 bg-blue-600 text-white px-8 py-4 rounded-xl">Skicka svar</button></div></div><script>let T,U;const tid=new URLSearchParams(location.search).get('id');async function init(){U=requireLoggedUser('customer');if(!U)return;const r=await fetch('/api/tickets');const a=await r.json();T=a.find(x=>x.id==tid&&x.customer===U.name);if(!T){location.href='customer-tickets.html';return}title.textContent=T.title;desc.textContent=T.desc||'';hist.innerHTML=(T.replies||[]).map(x=>`<div class="bg-white p-5 rounded-2xl"><b>${x.agent?'Support: '+x.agent:'Du'}</b><p>${x.text||''}</p></div>`).join('')}async function send(){if(!reply.value.trim())return;T.replies=T.replies||[];T.replies.push({date:new Date().toLocaleString('sv-SE'),agent:null,text:reply.value.trim()});await fetch('/api/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(T)});reply.value='';init()}window.onload=init;</script></body></html>
