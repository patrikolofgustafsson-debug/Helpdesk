<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Ärende - Supportportal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .img-preview { max-height: 250px; border-radius: 1.5rem; cursor: zoom-in; margin-top: 15px; border: 1px solid #e2e8f0; }
        .file-link { display: inline-flex; items-center: center; gap: 8px; background: #f1f5f9; padding: 10px 15px; border-radius: 12px; font-size: 11px; font-weight: 800; color: #475569; margin-top: 10px; }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <button onclick="location.href='customer-tickets.html'" class="text-slate-400 font-black uppercase text-[10px] tracking-widest hover:text-slate-800 transition">
                <i class="fas fa-arrow-left mr-2"></i> Tillbaka
            </button>
            <div id="status-pill" class="px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-widest">Laddar...</div>
        </header>

        <h1 id="display-title" class="text-5xl font-black text-slate-800 uppercase tracking-tighter italic mb-10 leading-none">-</h1>

        <div class="space-y-8">
            <div class="bg-white rounded-[3rem] p-10 shadow-sm border border-slate-100">
                <div class="flex justify-between mb-4">
                    <span id="display-date" class="text-[10px] font-black text-slate-300 uppercase tracking-widest"></span>
                    <span class="text-[10px] font-black text-blue-500 uppercase tracking-widest">Ditt ärende</span>
                </div>
                <div id="display-desc" class="text-slate-600 leading-relaxed italic text-lg font-medium whitespace-pre-wrap"></div>
                <div id="display-attachment"></div>
            </div>

            <div id="history-list" class="space-y-6"></div>

            <div id="reply-box" class="bg-white rounded-[3.5rem] p-8 shadow-xl border border-slate-100">
                <h4 class="text-[10px] font-black uppercase text-slate-400 mb-6 ml-4 italic">Skriv ett svar till supporten</h4>
                
                <textarea id="reply-text" placeholder="Behöver du lägga till något? Skriv här..." class="w-full p-8 bg-slate-50 rounded-[2.5rem] border-none outline-none font-medium text-slate-600 h-40 leading-relaxed mb-6 italic text-sm focus:ring-2 focus:ring-blue-500"></textarea>
                
                <div class="flex justify-between items-center px-4">
                    <div class="flex items-center gap-4">
                        <label class="cursor-pointer bg-slate-100 px-6 py-3 rounded-xl text-[9px] font-black uppercase text-slate-500 hover:bg-slate-200 transition">
                            <i class="fas fa-paperclip mr-2"></i> Bifoga fil
                            <input type="file" id="reply-file" class="hidden" onchange="handleFile()">
                        </label>
                        <span id="file-name-display" class="text-[9px] font-black text-blue-500 uppercase italic"></span>
                    </div>
                    <button onclick="sendReply()" class="bg-[#2563EB] text-white px-12 py-5 rounded-2xl font-black uppercase text-[10px] shadow-xl hover:bg-blue-700 transition transform active:scale-95">Skicka svar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ticket = null;
        let currentUser = JSON.parse(localStorage.getItem('loggedUser'));
        const tid = new URLSearchParams(window.location.search).get('id');
        let tempFileData = null;
        let tempFileName = "";

        async function loadTicket() {
            if (!tid) return location.href = 'customer-tickets.html';
            const res = await fetch('/api/tickets?t=' + Date.now());
            const tickets = await res.json();
            ticket = tickets.find(t => t.id == tid);

            if (!ticket || ticket.customer !== currentUser.name) {
                return location.href = 'customer-tickets.html';
            }
            render();
        }

        function renderAttachment(data, name) {
            if (!data) return "";
            if (data.startsWith("data:image/")) {
                return `<img src="${data}" class="img-preview" onclick="window.open(this.src)">`;
            }
            return `<a href="${data}" download="${name}" class="file-link"><i class="fas fa-file-download"></i> ${name}</a>`;
        }

        function render() {
            document.getElementById('display-title').innerText = ticket.title;
            document.getElementById('display-desc').innerText = ticket.desc;
            document.getElementById('display-date').innerText = ticket.created;
            document.getElementById('display-attachment').innerHTML = renderAttachment(ticket.image || ticket.file, ticket.fileName);

            const pill = document.getElementById('status-pill');
            pill.innerText = ticket.status === 'Open' ? 'Öppen' : 'Löst';
            pill.className = `px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-widest ${ticket.status === 'Open' ? 'bg-blue-50 text-blue-600' : 'bg-green-50 text-green-600'}`;

            // Om ärendet är löst, dölj svarsrutan
            if (ticket.status !== 'Open' && ticket.status !== 'Öppen') {
                document.getElementById('reply-box').innerHTML = `<p class="text-center text-slate-400 font-bold italic py-4 uppercase text-[10px] tracking-widest">Detta ärende är stängt</p>`;
            }

            const histList = document.getElementById('history-list');
            const replies = ticket.replies ? [...ticket.replies].reverse() : [];
            histList.innerHTML = replies.map(r => `
                <div class="flex ${r.agent ? 'justify-start' : 'justify-end'}">
                    <div class="max-w-[80%] p-8 rounded-[2.5rem] shadow-sm border ${r.agent ? 'bg-blue-600 text-white' : 'bg-white text-slate-600 border-slate-100'}">
                        <div class="flex justify-between items-center mb-3 gap-8">
                            <span class="text-[9px] font-black uppercase tracking-widest ${r.agent ? 'text-blue-200' : 'text-slate-300'}">${r.agent ? 'Support: ' + r.agent : 'Du'}</span>
                            <span class="text-[9px] font-bold uppercase ${r.agent ? 'text-blue-300' : 'text-slate-300'}">${r.date}</span>
                        </div>
                        <p class="text-sm italic font-medium leading-relaxed whitespace-pre-wrap">${r.text}</p>
                        ${renderAttachment(r.file, r.fileName)}
                    </div>
                </div>
            `).join('');
        }

        function handleFile() {
            const file = document.getElementById('reply-file').files[0];
            if (!file) return;
            tempFileName = file.name;
            const reader = new FileReader();
            reader.onload = (e) => {
                tempFileData = e.target.result;
                document.getElementById('file-name-display').innerText = "Vald: " + file.name;
            };
            reader.readAsDataURL(file);
        }

        async function sendReply() {
            const text = document.getElementById('reply-text').value;
            if (!text.trim() && !tempFileData) return;

            if (!ticket.replies) ticket.replies = [];
            ticket.replies.push({
                date: new Date().toLocaleString('sv-SE'),
                agent: null,
                text: text,
                file: tempFileData,
                fileName: tempFileName
            });

            await fetch('/api/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(ticket)
            });

            document.getElementById('reply-text').value = "";
            tempFileData = null;
            document.getElementById('file-name-display').innerText = "";
            loadTicket();
        }

        window.onload = loadTicket;
    </script>
</body>
</html>
