<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ärenden - Eventful Desk</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"></head><body><main class="page"><div class="toolbar"><div style="flex:1"><p class="eyebrow">Support management</p><h1 class="title">Ärenden</h1></div><button id="newBtn" class="btn btn-primary">Nytt ärende</button></div><div class="toolbar"><input id="search" class="input" placeholder="Sök..." style="max-width:430px"><select id="filter" class="input" style="max-width:220px"><option value="">Alla statusar</option><option>Open</option><option>Pending</option><option>Resolved</option></select></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Ämne</th><th>Kund</th><th>Agent</th><th>Status</th><th>Uppdaterad</th></tr></thead><tbody id="rows"></tbody></table></div></main><div id="modal" class="modal"><div class="modal-box stack"><h2>Nytt ärende</h2><select id="customerId" class="input"></select><input id="subject" class="input" placeholder="Ämne"><textarea id="description" class="input" rows="7" placeholder="Beskrivning"></textarea><select id="service" class="input"><option>Microsoft 365</option><option>FlowSync</option><option>SchoolSoft</option><option>Övrigt</option></select><button id="create" class="btn btn-primary">Skapa</button><button id="close" class="btn btn-light">Stäng</button><div id="message" class="status"></div></div></div><script type="module">import{mount}from'./js/layout.js';import{requireRole}from'./js/auth.js';import{get,post}from'./js/api.js';import{esc,date,msg}from'./js/util.js';await requireRole(['admin','agent']);mount('tickets.html');let data=[];async function load(){data=await get('/api/tickets');render()}function render(){const q=search.value.toLowerCase(),f=filter.value;rows.innerHTML=data.filter(x=>(!f||x.status===f)&&(!q||JSON.stringify(x).toLowerCase().includes(q))).map(x=>`<tr style="cursor:pointer" onclick="location.href='ticket.html?id=${encodeURIComponent(x.id)}'"><td><b>#${x.id}</b></td><td>${esc(x.subject)}</td><td>${esc(x.customerName)}</td><td>${esc(x.assignedAgentName||'Otilldelat')}</td><td><span class="pill ${x.status?.toLowerCase()}">${esc(x.status)}</span></td><td>${date(x.updatedAt)}</td></tr>`).join('')}async function customers(){const c=await get('/api/customers');customerId.innerHTML=c.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.company||'')}</option>`).join('')}newBtn.onclick=async()=>{await customers();modal.classList.add('open')};close.onclick=()=>modal.classList.remove('open');search.oninput=filter.onchange=render;create.onclick=async()=>{try{const t=await post('/api/tickets',{customerId:customerId.value,subject:subject.value,description:description.value,service:service.value});location.href='ticket.html?id='+t.id}catch(e){msg(e.message,true)}};await load();</script></body></html>
