<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ärenden - Eventful Desk</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><script src="api.js"></script><script src="shared.js" defer></script><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');html,body{margin:0;background:#f8fafc;font-family:Inter,sans-serif}body{color:#0f172a}.app{margin-left:16rem;padding:3rem;min-height:100vh}@media(max-width:1024px){.app{margin-left:0;padding:1.5rem}}</style><style id="desk-layout-fix">
.desk-sidebar{display:block!important;transform:translateX(0);transition:transform .2s ease}.desk-menu-toggle{display:none;position:fixed;left:16px;top:16px;z-index:60;background:#0f172a;color:#fff;border:0;border-radius:12px;width:46px;height:46px}.app{margin-left:16rem!important;padding:3rem!important;min-height:100vh}@media(max-width:1024px){.desk-sidebar{transform:translateX(-100%)}.desk-sidebar.open{transform:translateX(0)}.desk-menu-toggle{display:block}.app{margin-left:0!important;padding:5rem 1.5rem 1.5rem!important}}
</style></head><body><main class="app"><div class="flex justify-between mb-10"><div><p class="text-blue-600 text-xs font-black uppercase tracking-[.3em]">Support Management</p><h1 class="text-6xl font-black uppercase italic">Ärenden</h1></div><button onclick="modal(true)" class="bg-blue-600 text-white px-8 rounded-3xl font-black uppercase">Nytt ärende</button></div><div class="bg-white p-5 rounded-3xl mb-6"><input id="q" oninput="render()" class="w-full p-4 bg-slate-50 rounded-xl" placeholder="Sök på ämne, kund eller ID..."></div><div class="bg-white rounded-[3rem] overflow-auto"><table class="w-full text-left"><thead><tr class="bg-slate-50"><th class="p-6">ID</th><th>Ämne</th><th>Kund</th><th>Agent</th><th>Status</th></tr></thead><tbody id="list"></tbody></table></div></main><div id="m" class="hidden fixed inset-0 bg-slate-900/90 z-50 items-center justify-center"><div class="bg-white p-10 rounded-[3rem] w-full max-w-xl"><h2 class="text-3xl font-black uppercase italic mb-6">Skapa ärende</h2><select id="cust" class="w-full p-4 bg-slate-50 rounded-xl mb-3"></select><input id="title" class="w-full p-4 bg-slate-50 rounded-xl mb-3" placeholder="Rubrik"><textarea id="desc" class="w-full p-4 bg-slate-50 rounded-xl h-32 mb-3" placeholder="Beskrivning"></textarea><div class="flex gap-3"><button onclick="modal(false)" class="flex-1 p-4">Avbryt</button><button onclick="save()" class="flex-1 p-4 bg-blue-600 text-white rounded-xl">Spara</button></div></div></div><script>let T=[],C=[];async function init(){const[t,c]=await Promise.all([fetch('/api/tickets?t='+Date.now()),fetch('/api/customers')]);T=await t.json();C=await c.json();document.getElementById('cust').innerHTML=C.map(x=>`<option>${x.name}</option>`).join('');render()}function render(){const q=document.getElementById('q').value.toLowerCase();document.getElementById('list').innerHTML=T.filter(x=>!q||String(x.id).includes(q)||x.title?.toLowerCase().includes(q)||x.customer?.toLowerCase().includes(q)).slice().reverse().map(x=>`<tr onclick="location.href='ticket-one-ticket.html?id=${x.id}'" class="border-b hover:bg-slate-50 cursor-pointer"><td class="p-6 text-blue-600 font-black">#${x.id}</td><td class="font-black">${x.title||''}</td><td>${x.customer||''}</td><td>${x.agent||'Otilldelat'}</td><td>${x.status||'Open'}</td></tr>`).join('')}function modal(v){const m=document.getElementById('m');m.classList.toggle('hidden',!v);m.classList.toggle('flex',v)}async function save(){await fetch('/api/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.getElementById('title').value,desc:document.getElementById('desc').value,customer:document.getElementById('cust').value,service:'Microsoft',status:'Open',category:'Felanmälan',group:'1st Line',source:'Portal'})});modal(false);init()}window.onload=init;</script></body></html>
