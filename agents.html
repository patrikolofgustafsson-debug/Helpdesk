<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenter - Eventful Desk</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><script src="api.js"></script><script src="shared.js" defer></script><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');html,body{margin:0;background:#f8fafc;font-family:Inter,sans-serif}body{color:#0f172a}.app{margin-left:16rem;padding:3rem;min-height:100vh}@media(max-width:1024px){.app{margin-left:0;padding:1.5rem}}</style></head><body><main class="app"><div class="flex justify-between mb-8"><h1 class="text-5xl font-black uppercase italic">Agenter</h1><button onclick="show()" class="bg-blue-600 text-white px-8 rounded-2xl font-black uppercase">Skapa agent</button></div><div class="bg-white rounded-[3rem] overflow-auto"><table class="w-full text-left"><thead><tr class="bg-slate-50"><th class="p-6">Namn</th><th>E-post</th><th></th></tr></thead><tbody id="list"></tbody></table></div></main><div id="m" class="hidden fixed inset-0 bg-slate-900/90 z-50 items-center justify-center"><div class="bg-white p-10 rounded-[3rem] w-full max-w-md"><input id="id" type="hidden"><input id="name" class="w-full p-4 bg-slate-50 rounded-xl mb-3" placeholder="Namn"><input id="email" class="w-full p-4 bg-slate-50 rounded-xl mb-3" placeholder="E-post"><button onclick="save()" class="w-full p-4 bg-blue-600 text-white rounded-xl">Spara</button></div></div><script>let A=[];async function init(){const r=await fetch('/api/agents');A=await r.json();document.getElementById('list').innerHTML=A.map(x=>`<tr class="border-b"><td class="p-6 font-black">${x.name}</td><td>${x.email}</td><td><button onclick="edit('${x.id}')" class="text-blue-600 mr-3">Redigera</button><button onclick="del('${x.id}')" class="text-red-500">Radera</button></td></tr>`).join('')}function show(){document.getElementById('m').classList.remove('hidden');document.getElementById('m').classList.add('flex')}function edit(i){const a=A.find(x=>String(x.id)===String(i));id.value=a.id;name.value=a.name;email.value=a.email;show()}async function save(){await fetch('/api/agents/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id.value||null,name:name.value,email:email.value})});location.reload()}async function del(i){if(confirm('Radera agent?')){await fetch('/api/agents/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:i})});init()}}window.onload=init;</script></body></html>
