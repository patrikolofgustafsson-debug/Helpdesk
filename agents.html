<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenter - Eventful Desk</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"></head><body><main class="page"><div class="toolbar"><h1 class="title" style="flex:1">Agenter</h1><button id="newBtn" class="btn btn-primary">Ny agent</button></div><div id="cards" class="grid grid-2"></div></main><div id="modal" class="modal"><div class="modal-box stack"><h2>Agent</h2><input id="id" type="hidden"><input id="name" class="input" placeholder="Namn"><input id="email" class="input" placeholder="E-post"><input id="password" type="password" class="input" placeholder="Tillfälligt lösenord"><select id="role" class="input"><option value="agent">Agent</option><option value="admin">Administratör</option></select><button id="save" class="btn btn-primary">Spara</button><button id="close" class="btn btn-light">Stäng</button><div id="message" class="status"></div></div></div><script type="module">import{mount}from'./js/layout.js';import{requireRole}from'./js/auth.js';import{get,post,put}from'./js/api.js';import{esc,msg}from'./js/util.js';await requireRole(['admin']);mount('agents.html');let D=[];async function load(){D=await get('/api/agents');cards.innerHTML=D.map(x=>`<div class="card"><h3>${esc(x.name)}</h3><p>${esc(x.email)}</p><span class="pill">${esc(x.role)}</span><button class="btn btn-light" onclick="editAgent('${x.id}')">Redigera</button></div>`).join('')}const idEl=document.getElementById('id'),nameEl=document.getElementById('name'),emailEl=document.getElementById('email'),passwordEl=document.getElementById('password'),roleEl=document.getElementById('role'),modalEl=document.getElementById('modal'),newBtnEl=document.getElementById('newBtn'),closeEl=document.getElementById('close'),saveEl=document.getElementById('save');function openAgent(x={}){idEl.value=x.id||'';nameEl.value=x.name||'';emailEl.value=x.email||'';passwordEl.value='';roleEl.value=x.role||'agent';modalEl.classList.add('open')}window.editAgent=i=>openAgent(D.find(x=>x.id===i)||{});newBtnEl.onclick=()=>openAgent();closeEl.onclick=()=>modalEl.classList.remove('open');saveEl.onclick=async()=>{try{const b={name:nameEl.value,email:emailEl.value,password:passwordEl.value,role:roleEl.value};idEl.value?await put('/api/agents/'+encodeURIComponent(idEl.value),b):await post('/api/agents',b);modalEl.classList.remove('open');await load()}catch(e){msg(e.message,true)}};load();</script></body></html>
