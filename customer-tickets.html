<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mina ärenden - Eventful Desk</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><script src="api.js"></script><script src="shared.js" defer></script><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');html,body{margin:0;background:#f8fafc;font-family:Inter,sans-serif}body{color:#0f172a}.app{margin-left:16rem;padding:3rem;min-height:100vh}@media(max-width:1024px){.app{margin-left:0;padding:1.5rem}}</style></head><body class="p-6 md:p-12"><div class="max-w-4xl mx-auto"><div class="flex justify-between mb-12"><div><h1 class="text-5xl font-black uppercase italic">Support</h1><p class="text-xs text-slate-400">Inloggad: <span id="who"></span></p></div><button onclick="logout()" class="bg-white p-4 rounded-xl">Logga ut</button></div><div id="list"></div></div><script>let U;async function init(){U=requireLoggedUser('customer');if(!U)return;who.textContent=U.name;const r=await fetch('/api/tickets');const a=await r.json();const mine=a.filter(x=>x.customer===U.name);list.innerHTML=mine.length?mine.slice().reverse().map(x=>`<div onclick="location.href='customer-ticket-one.html?id=${x.id}'" class="bg-white p-7 rounded-3xl mb-4 cursor-pointer"><b>#${x.id} ${x.title}</b><span class="float-right">${x.status}</span></div>`).join(''):'<div class="bg-white p-12 rounded-3xl text-center text-slate-400">Du har inga ärenden.</div>'}function logout(){localStorage.removeItem('loggedUser');location.href='login.html'}window.onload=init;</script></body></html>
