<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Mina Ärenden - Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .ticket-card { transition: all 0.3s ease; border: 1px solid #f1f5f9; }
        .ticket-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .modal { transition: opacity 0.25s ease; }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-16">
            <div>
                <h1 class="text-6xl font-black text-slate-800 uppercase tracking-tighter italic leading-none">Support</h1>
                <p class="text-slate-400 font-bold mt-2 italic uppercase text-[10px] tracking-widest">Inloggad: <span id="user-display" class="text-blue-600">...</span></p>
            </div>
            <div class="flex gap-4">
                <button onclick="openCreateModal()" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-black uppercase text-[10px] shadow-lg hover:bg-blue-700 transition-all">Nytt ärende</button>
                <button onclick="localStorage.clear(); location.href='login.html'" class="bg-white text-slate-400 px-6 py-4 rounded-2xl text-[10px] font-black uppercase border border-slate-100">Logga ut</button>
            </div>
        </header>

        <div id="ticket-list" class="space-y-4">
            <p class="text-center text-slate-400 italic py-20">Laddar dina ärenden...</p>
        </div>
    </div>

    <div id="create-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xl rounded-[3rem] p-10 shadow-2xl">
            <h2 class="text-3xl font-black text-slate-800 uppercase italic tracking-tighter mb-8">Beskriv ditt problem</h2>
            
            <div class="space-y-4">
                <input type="text" id="new-title" placeholder="Vad gäller det? (Kort rubrik)" class="w-full p-6 bg-slate-50 rounded-2xl border-none font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500">
                
                <select id="new-service" class="w-full p-6 bg-slate-50 rounded-2xl border-none font-bold text-sm outline-none">
                    <option value="Microsoft">Microsoft 365 / Teams</option>
                    <option value="Google">Google Workspace</option>
                    <option value="Hårdvara">Dator / Hårdvara</option>
                    <option value="Övrigt">Övrigt</option>
                </select>

                <textarea id="new-desc" placeholder="Beskriv felet så utförligt som möjligt..." class="w-full p-6 bg-slate-50 rounded-2xl border-none font-medium text-sm h-40 outline-none focus:ring-2 focus:ring-blue-500"></textarea>

                <div class="flex items-center gap-4 p-2">
                    <label class="flex items-center gap-2 cursor-pointer bg-slate-100 px-4 py-2 rounded-lg text-[10px] font-black uppercase text-slate-500 hover:bg-slate-200 transition">
                        <i class="fas fa-paperclip"></i> Bifoga Bild/Fil
                        <input type="file" id="new-file" class="hidden" onchange="previewFile()">
                    </label>
                    <span id="file-name" class="text-[9px] font-bold text-blue-500 uppercase italic"></span>
                </div>

                <div class="flex gap-4 pt-4">
                    <button onclick="closeCreateModal()" class="flex-1 py-4 text-slate-400 font-black uppercase text-[10px]">Avbryt</button>
                    <button onclick="submitTicket()" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black uppercase text-[10px] shadow-xl">Skicka ärende</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('loggedUser')) || { name: "Gäst" };
        let base64File = null;
        let fileName = "";

        function init() {
            document.getElementById('user-display').innerText = currentUser.name;
            fetchTickets();
        }

        async function fetchTickets() {
            const res = await fetch('/api/tickets?t=' + Date.now());
            const tickets = await res.json();
            
            // FILTRERA: Här ser vi till att Johan bara ser sina egna!
            const myTickets = tickets.filter(t => t.customer === currentUser.name);
            
            const listEl = document.getElementById('ticket-list');
            if (myTickets.length === 0) {
                listEl.innerHTML = '<div class="bg-white p-20 rounded-[3rem] text-center border-2 border-dashed border-slate-100 text-slate-400 italic">Du har inga aktiva ärenden.</div>';
                return;
            }

            listEl.innerHTML = myTickets.slice().reverse().map(t => `
                <div onclick="location.href='customer-ticket-one.html?id=${t.id}'" class="ticket-card bg-white p-8 rounded-[2.5rem] flex justify-between items-center cursor-pointer shadow-sm">
                    <div>
                        <span class="text-[9px] font-black text-blue-500 uppercase tracking-[0.2em]">#${t.id}</span>
                        <h3 class="text-xl font-black text-slate-800 uppercase italic mt-1">${t.title}</h3>
                        <p class="text-slate-400 text-[10px] font-bold uppercase mt-2">${t.created || 'Nyss skapad'} • ${t.service}</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="px-4 py-1 rounded-full text-[9px] font-black uppercase tracking-widest ${t.status === 'Open' ? 'bg-blue-50 text-blue-600' : 'bg-green-50 text-green-600'}">
                            ${t.status === 'Open' ? 'Öppen' : 'Löst'}
                        </span>
                        <i class="fas fa-chevron-right text-slate-200"></i>
                    </div>
                </div>
            `).join('');
        }

        function previewFile() {
            const file = document.getElementById('new-file').files[0];
            if (!file) return;
            fileName = file.name;
            const reader = new FileReader();
            reader.onload = (e) => {
                base64File = e.target.result;
                document.getElementById('file-name').innerText = "Vald: " + fileName;
            };
            reader.readAsDataURL(file);
        }

        function openCreateModal() { document.getElementById('create-modal').classList.remove('hidden'); }
        function closeCreateModal() { 
            document.getElementById('create-modal').classList.add('hidden'); 
            base64File = null;
            document.getElementById('file-name').innerText = "";
        }

        async function submitTicket() {
            const title = document.getElementById('new-title').value;
            const desc = document.getElementById('new-desc').value;
            const service = document.getElementById('new-service').value;

            if (!title || !desc) return alert("Beskriv ditt problem först!");

            const newTicket = {
                title: title,
                desc: desc,
                service: service,
                customer: currentUser.name, // Sätter Johan Lind som ägare!
                status: "Open",
                image: base64File,
                fileName: fileName,
                replies: []
            };

            await fetch('/api/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newTicket)
            });

            closeCreateModal();
            fetchTickets(); // Uppdatera listan direkt
        }

        window.onload = init;
    </script>
</body>
</html>
